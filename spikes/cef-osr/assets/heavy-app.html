<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vita PSD-000 heavy OSR fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0b0d10;
        color: #eef2f8;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      main {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-columns: 320px 1fr;
        background:
          linear-gradient(135deg, rgba(26, 94, 99, 0.35), transparent 35%),
          radial-gradient(circle at 75% 20%, rgba(197, 64, 72, 0.25), transparent 30%),
          #11161c;
      }

      aside {
        padding: 24px;
        border-right: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(8, 10, 13, 0.72);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .metric {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-variant-numeric: tabular-nums;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(16, minmax(0, 1fr));
        gap: 8px;
        padding: 24px;
      }

      .tile {
        min-height: 86px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02)),
          var(--tile-color);
      }

      canvas {
        width: 100%;
        height: 160px;
        display: block;
        margin-top: 24px;
        background: #05070a;
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <h1>PSD-000 Web Fixture</h1>
        <div class="metric"><span>Paint count</span><strong id="paint">0</strong></div>
        <div class="metric"><span>Tiles</span><strong>256</strong></div>
        <div class="metric"><span>Motion source</span><strong>native compositor</strong></div>
        <canvas id="chart" width="512" height="160"></canvas>
      </aside>
      <section class="grid" id="grid"></section>
    </main>
    <script>
      window.__vitaPaintCounter = 0;
      window.__vitaFixtureReady = false;

      const grid = document.getElementById("grid");
      const paint = document.getElementById("paint");
      const chart = document.getElementById("chart");
      const ctx = chart.getContext("2d");

      for (let index = 0; index < 256; index += 1) {
        const tile = document.createElement("div");
        tile.className = "tile";
        const hue = (index * 37) % 360;
        tile.style.setProperty("--tile-color", `hsl(${hue} 45% 24%)`);
        grid.appendChild(tile);
      }

      function drawChart() {
        if (ctx === null) {
          return;
        }
        ctx.clearRect(0, 0, chart.width, chart.height);
        for (let index = 0; index < 256; index += 1) {
          const x = (index / 256) * chart.width;
          const height = 24 + (Math.sin(index * 0.21) + 1) * 58;
          ctx.fillStyle = `hsl(${(index * 19) % 360} 55% 54%)`;
          ctx.fillRect(x, chart.height - height, 2, height);
        }
      }

      requestAnimationFrame(() => {
        window.__vitaPaintCounter += 1;
        paint.textContent = String(window.__vitaPaintCounter);
        drawChart();
        window.__vitaFixtureReady = true;
      });
    </script>
  </body>
</html>
