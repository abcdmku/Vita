# Vita immutable Debian root baseline.
# Vita-ImmutableRoot=read-only
# Keep this package allowlist in lockstep with os/x86_64/test/root-determinism.test.ts.

[Distribution]
Distribution=debian
Release=trixie
Mirror=https://snapshot.debian.org/archive/debian/20260613T000000Z/
Repositories=main

[Output]
Format=directory
ImageVersion=0.1-bootstrap

[Content]
BasePackages=no
Bootable=no
CleanPackageMetadata=yes
WithNetwork=no
Packages=
    bash
    ca-certificates
    coreutils
    dbus
    initramfs-tools
    iproute2
    kmod
    linux-image-amd64
    nftables
    systemd
    systemd-boot
    systemd-boot-efi
    systemd-sysv
    udev
    util-linux
Environment=
    SOURCE_DATE_EPOCH=1781308800
    TZ=UTC
    LC_ALL=C.UTF-8
