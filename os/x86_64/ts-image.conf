# Vita x86_64 deterministic on-device TypeScript runtime integration plan (P1-030).
#
# Pins the EXACT Deno runtime (version + sha256 of the upstream release asset) and the install
# manifest that stages it + the TS entrypoint into the rootfs via the mkosi --extra-tree overlay.
# Same pin -> byte-identical binary, so the verity root hash stays stable (mirrors agent-image.conf).
#
# The Deno binary is a build artifact, NOT committed (it is large): os/x86_64/ts-image.mjs fetches
# the pinned asset, VERIFIES it against Sha256 below, unzips it, and stages it at Binary= before
# mkosi runs. The TS sources (main.ts + vendor/*) ARE committed under the overlay.

[Paths]
WorkRoot=/work
OverlayRoot=/work/os/x86_64/ts-overlay
Config=/work/os/x86_64/ts-image.conf

[Runtime]
# Deno — single self-contained executable; runs TypeScript directly with a default-deny sandbox.
# linux-gnu (glibc) variant: Debian trixie ships glibc, so this is the correct target (NOT musl).
Name=deno
# Spec baseline (typescript_personal_node_os_build_spec.md §"Toolchain baselines": "Deno 2.8").
# Pinned to the latest 2.8.x patch release at authoring time.
Version=2.8.3
Asset=deno-x86_64-unknown-linux-gnu.zip
Url=https://github.com/denoland/deno/releases/download/v2.8.3/deno-x86_64-unknown-linux-gnu.zip
# Upstream-published checksum (deno-x86_64-unknown-linux-gnu.zip.sha256sum), independently confirmed
# by sha256sum over the downloaded asset. VERIFY before staging (ts-image.mjs hard-fails on mismatch).
Sha256=30455b845ffa6082209c3590269c910ad3b7efdf28c9879afd4006c47ae54197
# The single executable inside the zip.
ArchiveMember=deno

[Wasmtime]
# Wasmtime — pinned WASI preview1 runtime for baked first-party wasm-service capsules.
# The .tar.xz is fetched at build time, sha256-verified, and only the wasmtime member below is staged.
Name=wasmtime
Version=36.0.11
Asset=wasmtime-v36.0.11-x86_64-linux.tar.xz
Url=https://github.com/bytecodealliance/wasmtime/releases/download/v36.0.11/wasmtime-v36.0.11-x86_64-linux.tar.xz
Sha256=30c45ec1342dafd7dc007f2647bdd98770c30a777ed5d0ed8f683d17c16910a8
ArchiveMember=wasmtime-v36.0.11-x86_64-linux/wasmtime
Binary=/usr/lib/vita/bin/wasmtime
BinaryMode=0755
BinaryOwner=root:root

[Install]
Binary=/usr/lib/vita/deno
BinaryMode=0755
BinaryOwner=root:root
EntryDir=/usr/lib/vita/ts
Entry=/usr/lib/vita/ts/main.ts
EntryMode=0644
EntryOwner=root:root

[Service]
Unit=vita-ts.service
UnitPath=/usr/lib/systemd/system/vita-ts.service
WantedBy=multi-user.target
EnablePath=/usr/lib/systemd/system/multi-user.target.wants/vita-ts.service
EnableTarget=../vita-ts.service
ExecStart=/usr/lib/vita/deno run --no-remote --cached-only --no-config --quiet /usr/lib/vita/ts/main.ts
Type=oneshot
Marker=VITA-TS

[Typecheck]
# AUTHORITATIVE typecheck for the on-device TS entrypoint. The Node `tsc` lane (root tsconfig.json)
# also compiles main.ts (via a minimal vendored Deno ambient decl, ts-overlay/usr/lib/vita/ts/vendor/
# deno.shim.d.ts that is NOT referenced from main.ts and is excluded in deno.json, so it stays
# invisible to Deno), but Deno code must be validated against Deno's REAL lib — so `deno check` is the
# gate that matters. The deno.json config lives at os/x86_64/ (NOT inside ts-overlay/, so it is not
# copied into the image rootfs by --extra-tree). Run from os/x86_64/:
#
#   deno check ts-overlay/usr/lib/vita/ts/main.ts
#
# Expect exit 0. `deno check` transitively checks the vendored relative imports (vendor/semver.ts).
# Verified on Deno 2.8.3 (the pinned baseline above).
Config=deno.json
Command=deno check ts-overlay/usr/lib/vita/ts/main.ts
WorkDir=os/x86_64
