# Vita x86_64 deterministic on-device TypeScript runtime integration plan (P1-030).
#
# Pins the EXACT Deno runtime (version + sha256 of the upstream release asset) and the install
# manifest that stages it + the TS entrypoint into the rootfs via the mkosi --extra-tree overlay.
# Same pin -> byte-identical binary, so the verity root hash stays stable (mirrors agent-image.conf).
#
# The Deno binary is a build artifact, NOT committed (it is large): os/x86_64/ts-image.mjs fetches
# the pinned asset, VERIFIES it against Sha256 below, unzips it, and stages it at Binary= before
# mkosi runs. The TS sources (main.ts + vendor/*) ARE committed under the overlay.

[Paths]
WorkRoot=/work
OverlayRoot=/work/os/x86_64/ts-overlay
Config=/work/os/x86_64/ts-image.conf

[Runtime]
# Deno — single self-contained executable; runs TypeScript directly with a default-deny sandbox.
# linux-gnu (glibc) variant: Debian trixie ships glibc, so this is the correct target (NOT musl).
Name=deno
Version=2.1.4
Asset=deno-x86_64-unknown-linux-gnu.zip
Url=https://github.com/denoland/deno/releases/download/v2.1.4/deno-x86_64-unknown-linux-gnu.zip
# Upstream-published checksum (deno-x86_64-unknown-linux-gnu.zip.sha256sum). VERIFY before staging.
Sha256=54a81939cccb2af114c4d0a68a554cf4a04b1f08728e70f663f83781de19d785
# The single executable inside the zip.
ArchiveMember=deno

[Install]
Binary=/usr/lib/vita/deno
BinaryMode=0755
BinaryOwner=root:root
EntryDir=/usr/lib/vita/ts
Entry=/usr/lib/vita/ts/main.ts
EntryMode=0644
EntryOwner=root:root

[Service]
Unit=vita-ts.service
UnitPath=/usr/lib/systemd/system/vita-ts.service
WantedBy=multi-user.target
EnablePath=/usr/lib/systemd/system/multi-user.target.wants/vita-ts.service
EnableTarget=../vita-ts.service
ExecStart=/usr/lib/vita/deno run --no-remote --cached-only --no-config --quiet /usr/lib/vita/ts/main.ts
Type=oneshot
Marker=VITA-TS
