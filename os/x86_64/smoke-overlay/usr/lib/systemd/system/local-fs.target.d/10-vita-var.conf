# Pull the /var mount into the local-fs boot transaction. Wants (not Requires) so that on a plain
# (non-verity) smoke image — where vita-data is absent and var.mount is nofail-skipped — local-fs.target
# still completes and the boot reaches multi-user. On a VITA_VERITY image var.mount mounts the data partition.
[Unit]
Wants=var.mount
