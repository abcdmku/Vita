# Vita SMOKE VM only — drop the serial console straight into a root shell.
# We run /bin/bash directly on the tty instead of agetty→login, which bypasses login/PAM/securetty AND root's
# /etc/passwd shell. That passwd shell (likely nologin in this minimal image) is what made autologin succeed and
# then instantly exit, looping the getty. Running bash directly avoids all of it. Smoke/test only — the
# production/full image uses real authentication and never includes this overlay.
[Service]
ExecStart=
ExecStart=-/bin/bash -i
Restart=always
RestartSec=2
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYPath=/dev/%I
TTYReset=yes
TTYVHangup=yes
KillMode=process
