# Vita SMOKE VM only — auto-login root on the serial console (ttyS0) so the QEMU `-nographic` boot drops
# straight into a root shell with no prompt. This ships the exact systemd drop-in rather than relying on mkosi's
# --autologin feature (unreliable across mkosi versions). The production/full image uses real authentication and
# never includes this overlay.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --keep-baud 115200,57600,38400,9600 %I $TERM
