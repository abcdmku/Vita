# Vita pinned mke2fs baseline for deterministic P1-024 rootfs images.

[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384
	reserved_ratio = 0

[fs_types]
	ext4 = {
		features = extent,huge_file,flex_bg,metadata_csum,64bit,dir_nlink,extra_isize
		blocksize = 4096
		inode_size = 256
		inode_ratio = 16384
		reserved_ratio = 0
		lazy_itable_init = 0
		lazy_journal_init = 0
	}
