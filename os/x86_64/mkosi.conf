[Include]
Include=../common/mkosi.conf

[Distribution]
Architecture=x86-64

[Output]
Output=vita-debian-trixie-x86_64-root

[Content]
# x86_64 repeats the full runtime package allowlist so the guest carries
# cryptsetup-bin for the VITA_LUKS=1 unlock and marker services.
# Keep in lockstep with build-root.mjs and test/root-determinism.test.ts.
Packages=
    bash
    ca-certificates
    coreutils
    cryptsetup-bin
    dbus
    initramfs-tools
    iproute2
    kmod
    libdrm2
    libegl-mesa0
    libegl1
    libgbm1
    libgl1-mesa-dri
    libgles2
    libinput10
    linux-image-amd64
    nftables
    systemd
    systemd-boot
    systemd-boot-efi
    systemd-sysv
    udev
    util-linux
