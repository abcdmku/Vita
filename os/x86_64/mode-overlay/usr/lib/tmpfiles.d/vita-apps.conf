# Vita platform persisted store — three-mode OS.
# APPS_ROOT=/var/lib/vita/apps is the per-app fs+kv backing for the platform server (Puter-compatible
# host). /var is the persistent data partition (mounted by var.mount), so this directory survives
# reboots and updates. It must exist before vita-platform.service starts in EVERY mode (headless too),
# which tmpfiles guarantees deterministically at boot. /var/lib/vita is created first (parent), then
# the apps store; group vita-agent matches the platform server's SupplementaryGroups so its DynamicUser
# can write via the group while the tree is not world-writable.
d /var/lib/vita 0750 root vita-agent -
d /var/lib/vita/apps 0770 root vita-agent -
# Owner-token + TLS material live on the SAME persistent partition so they survive reboot. owner/ holds
# the minted network-face owner bearer secret (0640 root:vita-agent, written by vita-owner-token
# .service); the platform DynamicUser reads it via group vita-agent. tls/ optionally holds an
# owner-provided cert+key (VITA_TLS_CERT/KEY); when absent the server self-signs in-process.
#
# SETGID (2750) on owner/ is LOAD-BEARING: vita-owner-token.service runs as root with
# SystemCallFilter=~@privileged, which BLOCKS the chown/fchownat syscall — so its explicit
# `chgrp vita-agent` SILENTLY FAILS and the minted token would be root:root 0640, which the platform
# DynamicUser (group vita-agent, not root) CANNOT READ → readOwnerToken() throws EACCES → the server
# falls back to a fresh RANDOM owner token every start (so the persisted /var token never authenticates
# the network face — every owner-token request 401s). The setgid bit makes the kernel assign the new
# token file group = the directory group (vita-agent) AT CREATE TIME, with no chown needed, so the
# DynamicUser reads it via the group. (host-verified: without setgid the file is root:root 640 and the
# network face 401s even with the correct persisted token.)
d /var/lib/vita/owner 2750 root vita-agent -
d /var/lib/vita/tls 2750 root vita-agent -
