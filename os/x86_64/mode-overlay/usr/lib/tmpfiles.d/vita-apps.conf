# Vita platform persisted store — three-mode OS.
# APPS_ROOT=/var/lib/vita/apps is the per-app fs+kv backing for the platform server (Puter-compatible
# host). /var is the persistent data partition (mounted by var.mount), so this directory survives
# reboots and updates. It must exist before vita-platform.service starts in EVERY mode (headless too),
# which tmpfiles guarantees deterministically at boot. /var/lib/vita is created first (parent), then
# the apps store; group vita-agent matches the platform server's SupplementaryGroups so its DynamicUser
# can write via the group while the tree is not world-writable.
d /var/lib/vita 0750 root vita-agent -
d /var/lib/vita/apps 0770 root vita-agent -
# Owner-token + TLS material live on the SAME persistent partition so they survive reboot. owner/ holds
# the minted network-face owner bearer secret (0400 file, written by vita-owner-token.service);
# LoadCredential reads it at platform-unit setup. tls/ optionally holds an owner-provided cert+key
# (VITA_TLS_CERT/KEY); when absent the server self-signs in-process. Both are root-owned (not the
# DynamicUser): the owner secret must not be readable by the unprivileged server's own UID directly.
d /var/lib/vita/owner 0750 root root -
d /var/lib/vita/tls 0750 root vita-agent -
