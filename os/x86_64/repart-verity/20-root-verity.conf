# Vita smoke VERITY layout — root HASH partition (dm-verity Merkle tree for 10-root.conf). Verity=hash +
# the matching VerityMatchKey=root tie it to the data partition; the firmware/initrd verifies every root
# block against this tree at boot, so tampering the root fails verification.
[Partition]
Type=root-verity
Verity=hash
VerityMatchKey=root
Minimize=guess
