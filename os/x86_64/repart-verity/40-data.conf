# Vita smoke VERITY layout - persistent mutable /var data partition. The root partition stays
# dm-verity read-only; smoke-overlay/usr/lib/systemd/system/var.mount mounts this partition by
# filesystem label instead of relying on machine-id-derived Discoverable Partitions UUIDs.
[Partition]
Type=linux-generic
Label=vita-data
Format=ext4
SizeMinBytes=512M
Weight=1000
FactoryReset=no
