# Vita smoke VERITY layout - persistent mutable /var data partition. In the
# VITA_LUKS=1 path this OUTER partition is an opaque LUKS2 container. The ext4
# filesystem label "vita-data" is applied later to the decrypted mapper, never
# to this outer partition, so /dev/disk/by-label/vita-data resolves only after
# unlock. build-and-boot.mjs synthesizes the old plaintext ext4 repart file
# when VITA_LUKS is off, preserving non-LUKS verity behavior.
[Partition]
Type=linux-generic
Label=vita-data
SizeMinBytes=512M
Weight=1000
FactoryReset=no
