# Vita smoke VERITY layout — root DATA partition. Verity=data pairs with the root-verity hash partition
# (same VerityMatchKey); systemd-repart builds the dm-verity hash tree over this partition's contents and
# mkosi (--verity) bakes the resulting roothash onto the UKI's kernel cmdline. Minimize=guess sizes the
# (read-only) root to its content so the roothash covers exactly the data.
[Partition]
Type=root
Format=ext4
CopyFiles=/
Minimize=guess
Verity=data
VerityMatchKey=root
