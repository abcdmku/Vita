# Vita smoke VERITY layout — ESP (systemd-repart). Used ONLY when VITA_VERITY=1, via mkosi
# --repart-directory; the default smoke/SB build keeps mkosi's built-in ESP+root layout. The UKI +
# bootloader that mkosi stages under /boot + /efi in the rootfs are copied onto this ESP partition.
[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
