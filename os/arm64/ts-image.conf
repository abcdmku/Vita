# Vita arm64 deterministic on-device TypeScript runtime integration plan (P1-091).
#
# The committed TS source/service overlay is shared from os/x86_64/ts-overlay.
# This arm64 runtime overlay stages only architecture-specific runtime binaries
# into /usr/lib/vita before mkosi applies --extra-tree=os/arm64/ts-runtime-overlay.
# The binary files are build artifacts and are gitignored.

[Paths]
WorkRoot=/work
OverlayRoot=/work/os/arm64/ts-runtime-overlay
Config=/work/os/arm64/ts-image.conf
SharedSourceOverlay=/work/os/x86_64/ts-overlay

[Runtime]
# Deno -- single self-contained executable; runs TypeScript directly with a
# default-deny sandbox. Debian trixie uses glibc, so use the linux-gnu target.
Name=deno
Version=2.8.3
Asset=deno-aarch64-unknown-linux-gnu.zip
Url=https://github.com/denoland/deno/releases/download/v2.8.3/deno-aarch64-unknown-linux-gnu.zip
Sha256=OWNER_VERIFIED_ARM64_DENO_SHA256_REQUIRED
ArchiveMember=deno

[Wasmtime]
# Wasmtime -- pinned WASI preview1 runtime for baked first-party wasm-service capsules.
Name=wasmtime
Version=36.0.11
Asset=wasmtime-v36.0.11-aarch64-linux.tar.xz
Url=https://github.com/bytecodealliance/wasmtime/releases/download/v36.0.11/wasmtime-v36.0.11-aarch64-linux.tar.xz
Sha256=OWNER_VERIFIED_ARM64_WASMTIME_SHA256_REQUIRED
ArchiveMember=wasmtime-v36.0.11-aarch64-linux/wasmtime
Binary=/usr/lib/vita/bin/wasmtime
BinaryMode=0755
BinaryOwner=root:root

[Install]
Binary=/usr/lib/vita/deno
BinaryMode=0755
BinaryOwner=root:root
