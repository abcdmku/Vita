[Include]
Include=../common/mkosi.conf

[Distribution]
Architecture=arm64

[Output]
Output=vita-debian-trixie-arm64-root

[Content]
# arm64 repeats the full runtime package allowlist so the guest carries
# cryptsetup-bin for later Vita storage slices, swaps only the kernel package,
# and adds Raspberry Pi 5 firmware staging.
# Keep in lockstep with build-root.mjs and test/root-determinism.test.ts.
Packages=
    bash
    ca-certificates
    coreutils
    cryptsetup-bin
    dbus
    initramfs-tools
    iproute2
    kmod
    linux-image-arm64
    raspi-firmware
    nftables
    systemd
    systemd-boot
    systemd-boot-efi
    systemd-sysv
    udev
    util-linux
