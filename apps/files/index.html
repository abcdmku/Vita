<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Files</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #3178c6;
        --accent-subtle: color-mix(in srgb, var(--accent) 13%, transparent);
        --background: #f5f7fb;
        --border: #ccd4e0;
        --hairline: #e3e8f0;
        --radius-md: 8px;
        --radius-sm: 5px;
        --surface: #ffffff;
        --surface-sunken: #edf2f8;
        --text: #152033;
        --text-faint: #7b8796;
        --text-muted: #596579;
        --text-secondary: #344055;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--background);
        color: var(--text);
        font: 13px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .files-app {
        display: grid;
        grid-template-columns: 184px minmax(0, 1fr);
        grid-template-rows: 80px minmax(0, 1fr);
        min-height: 100vh;
        overflow: hidden;
      }

      .titlebar {
        align-items: center;
        background: var(--surface);
        border-bottom: 1px solid var(--hairline);
        display: flex;
        gap: 12px;
        grid-column: 1 / -1;
        padding: 0 14px;
      }

      .traffic {
        display: inline-flex;
        gap: 6px;
      }

      .traffic span {
        background: var(--surface-sunken);
        border: 1px solid var(--border);
        border-radius: 50%;
        height: 11px;
        width: 11px;
      }

      .title {
        color: var(--text-secondary);
        font-weight: 650;
      }

      .toolbar {
        align-items: center;
        display: flex;
        gap: 8px;
        margin-left: 16px;
        min-width: 0;
      }

      .tool {
        align-items: center;
        background: var(--surface-sunken);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        display: inline-flex;
        height: 28px;
        justify-content: center;
        width: 28px;
      }

      .path {
        color: var(--text-secondary);
        font-family: "Geist Mono", "SFMono-Regular", Consolas, monospace;
        margin-left: 6px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .search {
        align-items: center;
        background: var(--surface-sunken);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text-muted);
        display: flex;
        gap: 8px;
        height: 32px;
        margin-left: auto;
        max-width: 240px;
        min-width: 160px;
        padding: 0 11px;
        width: 24vw;
      }

      .sidebar {
        background: var(--surface-sunken);
        border-right: 1px solid var(--hairline);
        padding: 18px 12px;
      }

      .side-heading {
        color: var(--text-faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 10px 8px 8px;
      }

      .side-item {
        align-items: center;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        display: flex;
        gap: 8px;
        min-height: 30px;
        padding: 0 9px;
      }

      .side-item[aria-current="page"] {
        background: var(--surface);
        color: var(--accent);
        font-weight: 650;
      }

      .content {
        background: var(--surface);
        min-width: 0;
        overflow: auto;
      }

      .row {
        align-items: center;
        border-bottom: 1px solid var(--hairline);
        display: grid;
        grid-template-columns: 28px minmax(160px, 1fr) 120px 72px 132px;
        min-height: 36px;
        padding: 0 16px;
      }

      .row.header {
        color: var(--text-faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        min-height: 32px;
      }

      .row[data-vita-selected="true"] {
        background: var(--accent-subtle);
      }

      .mono {
        font-family: "Geist Mono", "SFMono-Regular", Consolas, monospace;
      }

      .muted {
        color: var(--text-muted);
      }

      @media (max-width: 720px) {
        .files-app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }

        .search {
          display: none;
        }

        .row {
          grid-template-columns: 26px minmax(120px, 1fr) 80px;
        }

        .row > :nth-child(4),
        .row > :nth-child(5) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="files-app" data-vita-app="vita.app.files" data-vita-bind-attr-0="data-vita-status:files.status" data-vita-bind-attr-1="data-vita-error-code:files.errorCode">
      <header class="titlebar">
        <span class="traffic" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="title">Files</span>
        <nav class="toolbar" aria-label="Folder navigation">
          <button class="tool" type="button" data-vita-action="files.up" aria-label="Up">‹</button>
          <button class="tool" type="button" data-vita-action="files.refresh" aria-label="Refresh">↻</button>
          <span class="path" data-vita-bind-text="files.path">/</span>
          <span class="muted" data-vita-bind-text="files.notice" aria-live="polite"></span>
        </nav>
        <div class="search" aria-hidden="true">
          <span>⌕</span>
          <span>Search files</span>
        </div>
      </header>
      <aside class="sidebar" aria-label="Locations">
        <div class="side-heading">Favorites</div>
        <button class="side-item" type="button" data-vita-action="files.navigate" data-vita-path="/" aria-current="page">⌂ Home</button>
        <button class="side-item" type="button" data-vita-action="files.navigate" data-vita-path="/apps">▣ Apps</button>
        <button class="side-item" type="button" data-vita-action="files.navigate" data-vita-path="/documents">□ Documents</button>
        <div class="side-heading">Drives</div>
        <button class="side-item" type="button" data-vita-action="files.navigate" data-vita-path="/">▤ vita-disk</button>
      </aside>
      <section class="content" aria-label="Directory entries">
        <div class="row header" aria-hidden="true">
          <span></span>
          <span>Name</span>
          <span>Kind</span>
          <span>Size</span>
          <span>Modified</span>
        </div>
        <div data-vita-bind-list="files.entries">
          <button class="row" type="button" data-vita-key="entry:template" data-vita-action="files.select" data-vita-entry-name="" data-vita-path="" data-vita-selected="false" data-vita-bind-attr-0="data-vita-action:files.entry.action" data-vita-bind-attr-1="data-vita-entry-name:files.entry.name" data-vita-bind-attr-2="data-vita-path:files.entry.path" data-vita-bind-attr-3="data-vita-selected:files.entry.selected">
            <span aria-hidden="true" data-vita-bind-text="files.entry.icon"></span>
            <span class="mono" data-vita-bind-text="files.entry.name"></span>
            <span class="muted" data-vita-bind-text="files.entry.kind"></span>
            <span class="muted mono" data-vita-bind-text="files.entry.size"></span>
            <span class="muted" data-vita-bind-text="files.entry.modified"></span>
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="runtime/bootstrap.js"></script>
  </body>
</html>
