<!doctype html>
<!--
  Vita Deploy / Management Console — the FIRST real app on the Vita platform and the node's interactive
  admin UI.

  A REAL Puter app: a sandboxed web page that uses the GENUINE vendored puter.js SDK (Apache-2.0). It
  does not know it's running on Vita — it reads the puter.* launch params from its URL, points fs/kv/auth
  at Vita's LOCAL api_origin, and posts ui messages to the Vita shell (the parent).

  What it manages (the on-device control plane, VITA-EVAL → STATE → APPLY):
    - LIST installed/running apps (capsules) + their runtime, version, health
    - START / STOP a capsule (capsule.execute / capsule.lifecycle apply, via the control bridge)
    - node STATUS / health header (the VITA-EVAL / STATE summary)
    - per-capsule LOGS (the transient unit's journal)

  Two planes, exactly as Vita's compat layer prescribes:
    - data plane  (puter.kv / puter.auth)  → direct HTTP to api_origin, via the SDK
    - control plane (/control/*)           → direct HTTP to api_origin (the capability-gated bridge to
                                              agentd), authenticated with the SAME owner bearer token the
                                              SDK carries (read from puter.authToken)
    - ui plane    (puter.ui.*)             → postMessage to the Vita shell (window title, alerts)

  CONNECTION LIFECYCLE (the whole UI is driven by one state machine):
    connecting → connected  (control plane reachable: real data, start/stop live)
    connecting → offline     (control plane NOT reachable — browser/dev context, no agentd: a clean,
                              styled "running off-device" state, NEVER an infinite spinner)
    A bounded PROBE timeout guarantees we always leave `connecting` (no forever spin).
-->
<html lang="en" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vita Console</title>
    <!-- Shared Vita OS design system: canonical tokens + the --vita-* bridge the styles below read.
         Linked first so the console's existing var(--vita-color-*) references resolve to the system
         palette/typography instead of its local fallbacks — making it cohesive with the shell. -->
    <link rel="stylesheet" href="/ui_kits/styles.css" />
    <link rel="stylesheet" href="/ui_kits/vita-app-theme.css" />
    <!-- PRE-SDK origin pins: the puter.js bundle reads globalThis.PUTER_API_ORIGIN (its api base) and
         globalThis.PUTER_ORIGIN (its GUI/auth origin) at INIT. Pinning BOTH to our same origin BEFORE
         v2.js loads keeps every SDK call on this node — it never reaches the cloud api.puter.com or
         puter.com/auth/migrate-token (which 401 online and HANG on an offline/firewalled node, the root
         of the "connecting…" stall). The launch URL still overrides api_origin per the puter.* params. -->
    <script>
      window.PUTER_API_ORIGIN = (new URLSearchParams(location.search)).get("puter.api_origin") || (window.location.origin + "/api");
      window.PUTER_ORIGIN = window.location.origin;
      window.puter_gui_enabled = false;
    </script>
    <!-- Vendored, offline, Apache-2.0 puter.js client SDK (no runtime CDN). -->
    <script src="/_vendor/puter/v2.js"></script>
    <!-- Vendored, offline Lucide UMD (sets window.lucide + createIcons()). Same-origin only; the few
         icons here render via <i data-lucide>. Every createIcons() call below is guarded with
         `window.lucide &&` so a missing/blocked bundle can NEVER throw or break the lifecycle. -->
    <script src="/ui_kits/_vendor/lucide.min.js"></script>
    <style>
      /* ============================================================================================
         Vita Deploy Console — re-skinned to the Vita OS handoff design system (Activity.html look:
         stat cards + monospace data-table). The local --c-* palette is now a thin alias layer that
         reads STRAIGHT from the canonical handoff tokens (ui_kits/tokens/* via styles.css), so this
         app is byte-cohesive with the shell. No improvised hex; every colour/radius/font is a token.
         ============================================================================================ */
      :root {
        color-scheme: dark;
        /* accent + semantics → canonical tokens */
        --c-accent: var(--accent, #5a9bf6);
        --c-accent-hover: var(--accent-hover, #76aefc);
        --c-accent-fg: var(--accent-fg, #06101e);
        --c-accent-soft: var(--accent-subtle, rgba(90, 155, 246, 0.14));
        --c-ok: var(--success, #5bbf86);
        --c-ok-soft: var(--success-subtle, rgba(91, 191, 134, 0.16));
        --c-warn: var(--warning, #e0a86b);
        --c-warn-soft: var(--warning-subtle, rgba(224, 168, 107, 0.16));
        --c-err: var(--danger, #f08a8a);
        --c-err-soft: var(--danger-subtle, rgba(240, 138, 138, 0.16));
        /* surfaces → canonical ladder */
        --c-bg: var(--surface-base, #07090d);
        --c-panel: var(--surface, #13161c);
        --c-raised: var(--surface-raised, #181c23);
        --c-sunken: var(--surface-sunken, #0d1014);
        --c-hover: var(--surface-hover, rgba(255, 255, 255, 0.045));
        --c-border: var(--border, rgba(255, 255, 255, 0.085));
        --c-border-strong: var(--border-strong, rgba(255, 255, 255, 0.16));
        --c-hairline: var(--hairline, rgba(255, 255, 255, 0.06));
        /* text ramp */
        --c-text: var(--text, #eef1f6);
        --c-text-soft: var(--text-secondary, #b6bfcc);
        --c-muted: var(--text-muted, #838d9c);
        --c-faint: var(--text-faint, #5d6878);
        /* radii + type */
        --c-radius: var(--radius-lg, 6px);
        --c-radius-control: var(--radius-control, 4px);
        --c-radius-sm: var(--radius-sm, 3px);
        --c-radius-pill: var(--radius-pill, 999px);
        --c-tile: var(--radius-tile, 5px);
        --c-font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
        --c-mono: var(--font-mono, "Geist Mono", "SFMono-Regular", Consolas, monospace);
        --c-focus: var(--focus-ring, rgba(90, 155, 246, 0.55));
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }

      body {
        background: var(--c-bg);
        color: var(--c-text);
        font: 13px/1.55 var(--c-font);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .ico { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .ico svg { width: 100%; height: 100%; display: block; stroke-width: 2; }

      .console {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        height: 100vh;
        overflow: hidden;
        background: var(--c-panel);
      }

      /* ---- header bar ---- */
      header.bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 11px 18px;
        border-bottom: 1px solid var(--c-hairline);
        background: var(--c-raised);
      }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .logo {
        width: 30px; height: 30px; border-radius: var(--c-tile);
        background: var(--c-accent-soft); color: var(--c-accent);
        border: 1px solid transparent;
        display: grid; place-items: center;
        font-weight: 700; font-size: 13px; font-family: var(--c-mono);
        flex: none;
      }
      .logo .ico { width: 17px; height: 17px; }
      .brand h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em; color: var(--c-text); line-height: 1.2; }
      .brand .sub { font-size: 11.5px; color: var(--c-muted); line-height: 1.3; }

      .node-pill {
        display: inline-flex; align-items: center; gap: 7px;
        margin-left: auto;
        height: 28px; padding: 0 12px;
        border: 1px solid var(--c-border);
        border-radius: var(--c-radius-pill);
        background: var(--c-sunken);
        font-size: 12px; font-weight: 500;
        color: var(--c-text-soft);
        white-space: nowrap;
        transition: border-color 0.2s, color 0.2s, background 0.2s;
      }
      .node-pill[data-conn="offline"] {
        border-color: color-mix(in srgb, var(--c-warn) 42%, var(--c-border));
        background: var(--c-warn-soft); color: var(--c-warn);
      }
      .node-pill[data-conn="connected"] {
        border-color: color-mix(in srgb, var(--c-ok) 38%, var(--c-border));
        background: var(--c-ok-soft); color: var(--c-ok);
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-muted); flex: none; }
      .dot.ok { background: var(--c-ok); box-shadow: 0 0 8px color-mix(in srgb, var(--c-ok) 70%, transparent); }
      .dot.warn { background: var(--c-warn); box-shadow: 0 0 8px color-mix(in srgb, var(--c-warn) 70%, transparent); }
      .dot.bad { background: var(--c-err); box-shadow: 0 0 8px color-mix(in srgb, var(--c-err) 70%, transparent); }
      /* a soft pulse while we're still probing the control plane */
      .dot.pulsing { background: var(--c-accent); box-shadow: 0 0 8px color-mix(in srgb, var(--c-accent) 70%, transparent); animation: dot-pulse 1.1s ease-in-out infinite; }
      @keyframes dot-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

      /* ---- buttons (handoff) ---- */
      button.btn {
        font: 500 13px/1 var(--c-font); cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; gap: 7px;
        height: 30px; padding: 0 13px;
        border: 1px solid var(--c-border);
        background: var(--c-raised);
        color: var(--c-text);
        border-radius: var(--c-radius-control);
        transition: background 0.12s, border-color 0.12s, color 0.12s, opacity 0.12s, transform 0.06s;
      }
      button.btn .ico { width: 15px; height: 15px; color: var(--c-muted); }
      button.btn:hover:not(:disabled) { background: var(--c-hover); border-color: var(--c-border-strong); }
      button.btn:active:not(:disabled) { transform: translateY(0.5px); }
      button.btn:disabled { opacity: 0.42; cursor: default; }
      button.btn.primary {
        background: var(--c-accent); border-color: var(--c-accent); color: var(--c-accent-fg);
        box-shadow: var(--shadow-1, 0 1px 2px rgba(0,0,0,0.45)), 0 1px 0 rgba(255,255,255,0.12) inset;
      }
      button.btn.primary .ico { color: var(--c-accent-fg); }
      button.btn.primary:hover:not(:disabled) { background: var(--c-accent-hover); border-color: var(--c-accent-hover); color: var(--c-accent-fg); }
      button.btn.danger { background: var(--c-err-soft); border-color: color-mix(in srgb, var(--c-err) 40%, var(--c-border)); color: var(--c-err); }
      button.btn.danger .ico { color: var(--c-err); }
      button.btn.danger:hover:not(:disabled) { background: var(--c-err); border-color: var(--c-err); color: #1a0c0c; }
      button.btn.danger:hover:not(:disabled) .ico { color: #1a0c0c; }
      /* a button that's mid-action shows a spinner + locks out */
      button.btn.busy { pointer-events: none; opacity: 0.75; }
      button.btn.busy .spin { display: inline-block; }
      .spin {
        display: none; width: 11px; height: 11px; flex: none;
        border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---- stat strip: handoff stat cards ---- */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--c-hairline);
        background: var(--c-panel);
      }
      .stat {
        position: relative;
        padding: 13px 15px 14px;
        border: 1px solid var(--c-border);
        border-radius: var(--c-radius);
        background: var(--c-raised);
        box-shadow: var(--shadow-1, 0 1px 2px rgba(0,0,0,0.45));
        overflow: hidden;
      }
      .stat .k {
        font-family: var(--c-mono);
        font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--c-faint); font-weight: 600;
      }
      .stat .v { font-size: 22px; font-weight: 600; margin-top: 7px; min-height: 26px; line-height: 1.1; color: var(--c-text); letter-spacing: -0.01em; }
      .stat .v small { font-size: 12px; font-weight: 500; color: var(--c-muted); letter-spacing: 0; }
      .stat .v .accent { color: var(--c-accent); }
      .stat .v .ok { color: var(--c-ok); }

      /* skeleton shimmer for the connecting state — no raw "—" ever shown */
      .skel {
        display: inline-block; height: 15px; width: 56px; border-radius: var(--c-radius-sm); vertical-align: middle;
        background: linear-gradient(90deg, var(--c-sunken) 25%, var(--c-border) 50%, var(--c-sunken) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.3s ease-in-out infinite;
      }
      .skel.sm { width: 40px; }
      .skel.lg { width: 92px; }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

      /* ---- body: list + detail ---- */
      .body { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); min-height: 0; background: var(--c-panel); }
      .list-pane { min-height: 0; overflow: auto; border-right: 1px solid var(--c-hairline); }
      .list-head, .app-row {
        display: grid;
        grid-template-columns: minmax(120px, 1.6fr) 96px 84px 100px 132px;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
      }
      .list-head {
        position: sticky; top: 0; z-index: 1;
        min-height: 32px;
        background: var(--c-sunken);
        border-bottom: 1px solid var(--c-hairline);
        font-family: var(--c-mono);
        font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-faint); font-weight: 600;
      }
      .list-head span:last-child { text-align: right; }
      .app-row {
        min-height: 52px;
        border-bottom: 1px solid var(--c-hairline);
        cursor: pointer;
        background: transparent;
        text-align: left; width: 100%; border-left: 0; border-right: 0; border-top: 0;
        color: inherit; font: inherit;
        transition: background 0.1s;
      }
      .app-row:hover { background: var(--c-hover); }
      .app-row[aria-selected="true"] { background: var(--c-accent-soft); box-shadow: inset 2px 0 0 var(--c-accent); }
      .app-row[aria-selected="true"] .app-name .n { color: var(--c-accent); }
      .app-name { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
      .app-name .n { font-weight: 600; font-size: 13px; color: var(--c-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .app-name .r { font-size: 11px; color: var(--c-muted); font-family: var(--c-mono); }
      .mono { font-family: var(--c-mono); }
      .muted { color: var(--c-muted); }

      /* skeleton rows while loading the list */
      .skel-row {
        display: grid;
        grid-template-columns: minmax(120px, 1.6fr) 96px 84px 100px 132px;
        align-items: center; gap: 8px; padding: 0 18px;
        min-height: 52px; border-bottom: 1px solid var(--c-hairline);
      }

      /* ---- status badge (handoff pill) ---- */
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        height: 20px; padding: 0 8px; border-radius: var(--c-radius-pill);
        font-size: 11.5px; font-weight: 600;
        border: 1px solid var(--c-border); background: var(--c-sunken); color: var(--c-text-soft);
        white-space: nowrap;
      }
      .badge .d { width: 6px; height: 6px; border-radius: 50%; background: var(--c-muted); flex: none; }
      .badge.running { color: var(--c-ok); background: var(--c-ok-soft); border-color: color-mix(in srgb, var(--c-ok) 36%, var(--c-border)); }
      .badge.running .d { background: var(--c-ok); box-shadow: 0 0 6px color-mix(in srgb, var(--c-ok) 60%, transparent); }
      .badge.stopped { color: var(--c-muted); }
      .badge.disabled { color: var(--c-warn); background: var(--c-warn-soft); border-color: color-mix(in srgb, var(--c-warn) 36%, var(--c-border)); }
      .badge.disabled .d { background: var(--c-warn); }

      .health { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; }
      .health::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
      .health.ok { color: var(--c-ok); }
      .health.unhealthy { color: var(--c-err); }
      .health.unknown { color: var(--c-muted); }

      .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
      .row-actions button { height: 26px; padding: 0 10px; font-size: 12px; }

      /* ---- detail pane ---- */
      .detail { min-height: 0; overflow: auto; display: flex; flex-direction: column; background: var(--c-panel); }
      .detail-head { padding: 16px 18px 13px; border-bottom: 1px solid var(--c-hairline); }
      .detail-head h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; word-break: break-all; color: var(--c-text); }
      .detail-head .meta { margin-top: 11px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; font-size: 12px; color: var(--c-muted); }
      .detail-head .meta > span { display: flex; gap: 8px; min-width: 0; align-items: baseline; }
      .detail-head .meta b {
        color: var(--c-faint); font-weight: 600; flex: none;
        font-family: var(--c-mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
        min-width: 62px;
      }
      .detail-head .meta .val { color: var(--c-text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .detail-actions { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--c-hairline); }

      .logs-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
      .logs-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px 8px; }
      .logs-head .t { font-family: var(--c-mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-faint); font-weight: 600; }
      .logs {
        flex: 1; min-height: 0; overflow: auto;
        margin: 0 16px 16px; padding: 12px 14px;
        background: var(--c-sunken); border: 1px solid var(--c-hairline); border-radius: var(--c-radius);
        font-family: var(--c-mono); font-size: 12px; line-height: 1.7;
        white-space: pre-wrap; word-break: break-word;
      }
      .logs .l { display: flex; gap: 12px; }
      .logs .l .ts { color: var(--c-faint); flex: none; }
      .logs .l.info .m { color: var(--c-text-soft); }
      .logs .l.warn .m { color: var(--c-warn); }
      .logs .l.error .m { color: var(--c-err); }
      .logs .logs-state { color: var(--c-muted); display: flex; align-items: center; gap: 8px; }
      .logs .logs-state .spin { display: inline-block; color: var(--c-muted); }

      /* ---- empty / state panels ---- */
      .empty { padding: 44px 22px; text-align: center; color: var(--c-muted); }
      .empty .em-title { color: var(--c-text-soft); font-weight: 600; font-size: 13px; margin-bottom: 5px; }
      .empty .em-sub { font-size: 12px; line-height: 1.55; max-width: 320px; margin: 0 auto; }

      /* the big "running off-device" / error takeover, shown in place of the list+detail body */
      .state-panel {
        grid-column: 1 / -1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 48px 28px; text-align: center;
        background: var(--c-panel);
      }
      .state-panel .ic {
        width: 56px; height: 56px; border-radius: var(--c-radius);
        display: grid; place-items: center;
        border: 1px solid var(--c-border); background: var(--c-sunken); color: var(--c-muted);
      }
      .state-panel .ic svg { width: 26px; height: 26px; }
      .state-panel.offline .ic { border-color: color-mix(in srgb, var(--c-warn) 42%, var(--c-border)); background: var(--c-warn-soft); color: var(--c-warn); }
      .state-panel.error .ic { border-color: color-mix(in srgb, var(--c-err) 42%, var(--c-border)); background: var(--c-err-soft); color: var(--c-err); }
      .state-panel h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--c-text); letter-spacing: -0.01em; }
      .state-panel p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--c-text-soft); max-width: 430px; }
      .state-panel p b { color: var(--c-text); font-weight: 600; }
      .state-panel .hint { font-size: 12px; color: var(--c-muted); max-width: 430px; line-height: 1.55; }
      .state-panel .acts { margin-top: 6px; display: flex; gap: 10px; }

      .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(8px);
        display: flex; align-items: center; gap: 9px;
        background: var(--surface-overlay, var(--c-raised)); border: 1px solid var(--c-border); border-radius: var(--c-radius);
        backdrop-filter: var(--blur-thick); -webkit-backdrop-filter: var(--blur-thick);
        padding: 10px 16px; font-size: 13px; color: var(--c-text);
        box-shadow: var(--shadow-popover, 0 28px 64px -20px rgba(0,0,0,0.66));
        opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s;
        z-index: 50;
      }
      .toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c-ok); box-shadow: 0 0 8px color-mix(in srgb, var(--c-ok) 60%, transparent); flex: none; }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
      .toast.err::before { background: var(--c-err); box-shadow: 0 0 8px color-mix(in srgb, var(--c-err) 60%, transparent); }
      .toast.err { border-color: color-mix(in srgb, var(--c-err) 50%, var(--c-border)); }

      @media (max-width: 880px) {
        .stats { grid-template-columns: repeat(2, 1fr); }
        .detail-head .meta { grid-template-columns: 1fr; }
        .body { grid-template-columns: 1fr; }
        .detail { display: none; }
        .body.detail-open .list-pane { display: none; }
        .body.detail-open .detail { display: flex; }
        .body.detail-open .state-panel { display: flex; }
      }
    </style>
  </head>
  <body class="vita-surface">
    <main class="console" data-vita-app="vita.app.deploy-console">
      <header class="bar">
        <div class="brand">
          <div class="logo"><span class="ico"><i data-lucide="package"></i></span></div>
          <div>
            <h1>Vita console</h1>
            <div class="sub">Deploy &amp; manage the node</div>
          </div>
        </div>
        <span class="node-pill" id="node-pill" data-conn="connecting" title="agentd / control-plane reachability">
          <span class="dot pulsing" id="node-dot"></span>
          <span id="node-label">Connecting…</span>
        </span>
        <button class="btn" id="refresh-btn" type="button" title="Refresh node state">
          <span class="spin"></span><span class="ico"><i data-lucide="rotate-cw"></i></span><span>Refresh</span>
        </button>
      </header>

      <section class="stats" aria-label="Node summary">
        <div class="stat"><div class="k">Installed</div><div class="v" id="stat-installed"><span class="skel"></span></div></div>
        <div class="stat"><div class="k">Running</div><div class="v" id="stat-running"><span class="skel"></span></div></div>
        <div class="stat"><div class="k">Mode</div><div class="v" id="stat-mode" style="font-size:15px"><span class="skel lg"></span></div></div>
        <div class="stat"><div class="k">VITA-EVAL</div><div class="v" id="stat-eval" style="font-size:12px;font-weight:500;color:var(--c-text-soft)"><span class="skel lg"></span></div></div>
      </section>

      <div class="body" id="body">
        <div class="list-pane" id="list-pane">
          <div class="list-head" aria-hidden="true">
            <span>App / Capsule</span><span>Runtime</span><span>Health</span><span>Status</span><span style="text-align:right">Actions</span>
          </div>
          <div id="app-list"></div>
        </div>

        <aside class="detail" id="detail">
          <div class="empty" id="detail-empty">
            <div class="em-title">No capsule selected</div>
            <div class="em-sub">Select an app on the left to view its unit, integrity, and live logs.</div>
          </div>
          <div id="detail-body" hidden>
            <div class="detail-head">
              <h2 id="d-name"></h2>
              <div class="meta">
                <span><b>Version</b> <span id="d-version" class="val mono"></span></span>
                <span><b>Runtime</b> <span id="d-runtime" class="val"></span></span>
                <span><b>Unit</b> <span id="d-unit" class="val mono"></span></span>
                <span><b>UID</b> <span id="d-uid" class="val mono"></span></span>
                <span style="grid-column: 1 / -1"><b>Integrity</b> <span id="d-integrity" class="val mono"></span></span>
              </div>
            </div>
            <div class="detail-actions">
              <button class="btn primary" id="d-start" type="button"><span class="spin"></span><span>Start</span></button>
              <button class="btn danger" id="d-stop" type="button"><span class="spin"></span><span>Stop</span></button>
              <span style="margin-left:auto;align-self:center" id="d-status-badge"></span>
            </div>
            <div class="logs-wrap">
              <div class="logs-head">
                <span class="t">Logs</span>
                <button class="btn" id="d-logs-refresh" type="button" style="margin-left:auto;padding:4px 9px;font-size:11px">
                  <span class="spin"></span><span>Reload logs</span>
                </button>
              </div>
              <div class="logs" id="d-logs"></div>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <div class="toast" id="toast"><span id="toast-msg"></span></div>

    <!-- Replace the static header's <i data-lucide> placeholders (brand tile + Refresh) with SVGs.
         Guarded so a missing/blocked Lucide bundle can NEVER throw — the app stays fully functional
         without icons. This touches ONLY the static chrome icons; the lifecycle module below is
         independent and the state-panel icons it injects remain inline SVG. -->
    <script>
      (function () {
        function paint() { try { window.lucide && window.lucide.createIcons(); } catch (e) {} }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", paint);
        else paint();
      })();
    </script>

    <script type="module">
      // ---- launch params: the SDK reads puter.api_origin / puter.authToken from the URL ----
      // We read the SAME values to authenticate our direct-HTTP control-plane calls. (The SDK exposes
      // them as puter.APIOrigin / puter.authToken once booted; we also parse the URL as a fallback so
      // the console works even if a future SDK build renames those.)
      const params = new URLSearchParams(location.search);
      const apiOrigin =
        (window.puter && (puter.APIOrigin || puter.api_origin)) ||
        params.get("puter.api_origin") ||
        "/api";
      const authToken =
        (window.puter && puter.authToken) ||
        params.get("puter.auth.token") ||
        "";

      // How long we'll sit in "connecting" before declaring the control plane unreachable. A hard
      // ceiling so the UI can NEVER spin forever — overridable for fast headless tests via the URL.
      const PROBE_TIMEOUT_MS = Number(params.get("vita.probe_timeout_ms")) || 8000;

      const $ = (id) => document.getElementById(id);

      // ---- the one connection state machine that drives the whole UI ----
      // conn: "connecting" | "connected" | "offline"
      const state = { conn: "connecting", apps: [], selectedId: null, owner: null, status: null, lastError: null };

      // ---- self-report channel for the headless verification harness ----
      window.__CONSOLE__ = { ready: false, ops: [], state, error: null };
      function report(op, detail) {
        window.__CONSOLE__.ops.push({ op, detail, at: Date.now() });
        try {
          console.log("[console] " + op + (detail !== undefined ? " — " + (typeof detail === "string" ? detail : JSON.stringify(detail)) : ""));
        } catch { /* circular detail — skip */ }
      }

      // ---- toast ----
      let toastTimer = null;
      function toast(msg, isErr) {
        const t = $("toast");
        $("toast-msg").textContent = msg;
        t.className = "toast show" + (isErr ? " err" : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.className = "toast" + (isErr ? " err" : ""); }, 2800);
      }

      // ---- a button "busy" helper: spinner + disable while an async op runs ----
      async function withBusy(btn, fn) {
        if (!btn) return fn();
        const wasDisabled = btn.disabled;
        btn.classList.add("busy");
        btn.disabled = true;
        try { return await fn(); }
        finally { btn.classList.remove("busy"); btn.disabled = wasDisabled; }
      }

      // ---- control-plane client: direct HTTP to api_origin /control/*, owner-bearer auth ----
      // Classifies failures so the lifecycle can distinguish "control plane simply not here"
      // (offline / off-device) from a real transport/HTTP error once connected. `kind === "unreachable"`
      // is mirrored onto `.disconnected` so BOTH consumer styles work — the connect() lifecycle reads
      // `e.kind`, while refreshAll()/renderDisconnected() reads `e.disconnected`.
      class ControlError extends Error {
        constructor(message, kind, status) {
          super(message);
          this.kind = kind;
          this.status = status;
          // Unreachable === not connected from here → drives the clean disconnected/offline takeover.
          this.disconnected = (kind === "unreachable");
        }
      }
      // Every call is bounded by a hard timeout (AbortController) so a control plane that is unreachable
      // or never answers (no agentd in this context, a wedged socket, a firewalled origin) can NEVER hang
      // the UI on "connecting…/Loading apps…" — the fetch aborts and the caller renders a clean
      // disconnected state instead. `timeoutMs` is overridable per call (e.g. the connect() probe uses
      // PROBE_TIMEOUT_MS); it defaults to a hard ceiling so no call can ever spin forever.
      const CONTROL_TIMEOUT_MS = 6000;
      async function control(method, path, body, timeoutMs) {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), timeoutMs || CONTROL_TIMEOUT_MS);
        let res;
        try {
          res = await fetch(apiOrigin + path, {
            method,
            signal: ctl.signal,
            headers: {
              "authorization": "Bearer " + authToken,
              ...(body ? { "content-type": "application/json" } : {}),
            },
            ...(body ? { body: JSON.stringify(body) } : {}),
          });
        } catch (e) {
          // Network failure / abort (timeout) → the control plane is not reachable from here (off-device).
          // ControlError sets `.disconnected` so refreshAll() shows the disconnected state too.
          throw new ControlError(
            ctl.signal.aborted ? "control plane timed out" : (e && e.message) || "control plane unreachable",
            "unreachable",
            0,
          );
        } finally {
          clearTimeout(timer);
        }
        const text = await res.text();
        let json = {};
        try { json = text ? JSON.parse(text) : {}; } catch { /* non-json */ }
        if (!res.ok) {
          const code = json && (json.code || (json.error && json.error.code));
          const msg = (json && (json.message || (json.error && json.error.message))) || ("HTTP " + res.status);
          // A 404 "no control plane mounted" (or 403 control denied) means this api_origin can't reach
          // agentd from here — treat it as off-device (unreachable → disconnected), not a transient error.
          const kind = (code === "control_plane_unavailable" || res.status === 404 || res.status === 403)
            ? "unreachable"
            : "error";
          throw new ControlError(msg, kind, res.status);
        }
        return json;
      }

      // ---- rendering helpers ----
      function healthClass(h) { return h === "OK" ? "ok" : (h === "unhealthy" ? "unhealthy" : "unknown"); }
      function healthLabel(h) { return h === "OK" ? "OK" : (h === "unhealthy" ? "unhealthy" : "unknown"); }
      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
      function shortIntegrity(s) {
        const v = String(s == null ? "" : s);
        if (v === "" || v === "sha256:0") return "—";
        return v.length > 27 ? v.slice(0, 27) + "…" : v;
      }

      function statusBadge(app) {
        if (app.installState === "disabled") return '<span class="badge disabled"><span class="d"></span>disabled</span>';
        if (app.running) return '<span class="badge running"><span class="d"></span>running</span>';
        return '<span class="badge stopped"><span class="d"></span>stopped</span>';
      }

      // ---- the BIG state panels: offline (off-device) + error takeovers, shown instead of list+detail ----
      const ICON_OFFLINE =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>' +
        '<line x1="12" y1="20" x2="12.01" y2="20"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
      const ICON_ERROR =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>' +
        '<line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';

      function showStatePanel(kind) {
        // kind: "offline" | "error". Replaces the list+detail with a single clean explanatory panel.
        const offline = kind === "offline";
        const panel =
          '<div class="state-panel ' + kind + '">' +
            '<div class="ic">' + (offline ? ICON_OFFLINE : ICON_ERROR) + '</div>' +
            '<h2>' + (offline ? "Control plane unavailable" : "Couldn’t reach the control plane") + '</h2>' +
            '<p>' + (offline
              ? "This console is running <b>off-device</b> — the node control plane (agentd) isn’t reachable from here. Capsule management is paused until the console is opened on a live Vita node."
              : ("The control plane returned an error" + (state.lastError ? ": " + esc(state.lastError) : "") + ".")) + '</p>' +
            '<div class="hint">' + (offline
              ? "Data-plane features (files, settings) still work. Open this app on the node’s desktop to install, start, and stop capsules."
              : "This is usually transient. Retry, or check the node’s agentd is running.") + '</div>' +
            '<div class="acts"><button class="btn primary" id="state-retry" type="button"><span class="spin"></span><span>Retry connection</span></button></div>' +
          '</div>';
        $("body").innerHTML = panel;
        $("state-retry").addEventListener("click", () => withBusy($("state-retry"), connect));
      }

      // Restore the normal list+detail scaffold (after we leave the offline/error takeover).
      function ensureMainLayout() {
        if ($("list-pane")) return; // already present
        $("body").innerHTML =
          '<div class="list-pane" id="list-pane">' +
            '<div class="list-head" aria-hidden="true"><span>App / Capsule</span><span>Runtime</span><span>Health</span><span>Status</span><span style="text-align:right">Actions</span></div>' +
            '<div id="app-list"></div>' +
          '</div>' +
          '<aside class="detail" id="detail">' +
            '<div class="empty" id="detail-empty"><div class="em-title">No capsule selected</div><div class="em-sub">Select an app on the left to view its unit, integrity, and live logs.</div></div>' +
            '<div id="detail-body" hidden>' +
              '<div class="detail-head"><h2 id="d-name"></h2>' +
                '<div class="meta">' +
                  '<span><b>Version</b> <span id="d-version" class="val mono"></span></span>' +
                  '<span><b>Runtime</b> <span id="d-runtime" class="val"></span></span>' +
                  '<span><b>Unit</b> <span id="d-unit" class="val mono"></span></span>' +
                  '<span><b>UID</b> <span id="d-uid" class="val mono"></span></span>' +
                  '<span style="grid-column: 1 / -1"><b>Integrity</b> <span id="d-integrity" class="val mono"></span></span>' +
                '</div></div>' +
              '<div class="detail-actions">' +
                '<button class="btn primary" id="d-start" type="button"><span class="spin"></span><span>Start</span></button>' +
                '<button class="btn danger" id="d-stop" type="button"><span class="spin"></span><span>Stop</span></button>' +
                '<span style="margin-left:auto;align-self:center" id="d-status-badge"></span>' +
              '</div>' +
              '<div class="logs-wrap"><div class="logs-head"><span class="t">Logs</span>' +
                '<button class="btn" id="d-logs-refresh" type="button" style="margin-left:auto;padding:4px 9px;font-size:11px"><span class="spin"></span><span>Reload logs</span></button>' +
              '</div><div class="logs" id="d-logs"></div></div>' +
            '</div>' +
          '</aside>';
        wireDetailButtons();
      }

      // Loading skeleton rows for the list (connecting state).
      function renderListSkeleton() {
        const host = $("app-list");
        if (!host) return;
        let html = "";
        for (let i = 0; i < 3; i++) {
          html +=
            '<div class="skel-row">' +
              '<span><span class="skel lg"></span></span>' +
              '<span><span class="skel sm"></span></span>' +
              '<span><span class="skel sm"></span></span>' +
              '<span><span class="skel"></span></span>' +
              '<span style="text-align:right"><span class="skel"></span></span>' +
            '</div>';
        }
        host.innerHTML = html;
      }

      function renderList() {
        const host = $("app-list");
        if (!host) return;
        if (!state.apps.length) {
          host.innerHTML = '<div class="empty"><div class="em-title">No capsules installed</div>' +
            '<div class="em-sub">This node has no apps in its registry yet. Install one to manage it here.</div></div>';
          return;
        }
        host.innerHTML = "";
        for (const app of state.apps) {
          const row = document.createElement("button");
          row.className = "app-row";
          row.type = "button";
          row.setAttribute("data-app-id", app.id);
          row.setAttribute("aria-selected", String(app.id === state.selectedId));
          const canStart = app.installState === "installed" && !app.running;
          const canStop = app.running;
          row.innerHTML =
            '<span class="app-name"><span class="n">' + esc(app.id) + '</span><span class="r">v' + esc(app.version) + '</span></span>' +
            '<span class="mono muted">' + esc(app.runtime) + '</span>' +
            '<span class="health ' + healthClass(app.health) + '">' + esc(healthLabel(app.health)) + '</span>' +
            '<span>' + statusBadge(app) + '</span>' +
            '<span class="row-actions">' +
              '<button class="btn primary" data-act="start" data-id="' + esc(app.id) + '"' + (canStart ? "" : " disabled") + '><span class="spin"></span><span>Start</span></button>' +
              '<button class="btn danger" data-act="stop" data-id="' + esc(app.id) + '"' + (canStop ? "" : " disabled") + '><span class="spin"></span><span>Stop</span></button>' +
            '</span>';
          host.appendChild(row);
        }
      }

      function renderDetail() {
        const app = state.apps.find((a) => a.id === state.selectedId);
        const body = $("detail-body");
        const empty = $("detail-empty");
        if (!body || !empty) return;
        if (!app) { body.hidden = true; empty.hidden = false; return; }
        empty.hidden = true; body.hidden = false;
        $("d-name").textContent = app.id;
        $("d-version").textContent = "v" + app.version;
        $("d-runtime").textContent = app.runtime;
        $("d-unit").textContent = app.unit || "—";
        $("d-uid").textContent = app.dynamicUid || "—";
        $("d-integrity").textContent = shortIntegrity(app.integrity);
        $("d-status-badge").innerHTML = statusBadge(app) +
          ' <span class="health ' + healthClass(app.health) + '" style="margin-left:8px">' + esc(healthLabel(app.health)) + "</span>";
        $("d-start").disabled = !(app.installState === "installed" && !app.running);
        $("d-stop").disabled = !app.running;
      }

      function renderStats() {
        const s = state.status;
        const setConn = (conn, label, dotClass) => {
          const pill = $("node-pill"), dot = $("node-dot"), lab = $("node-label");
          pill.setAttribute("data-conn", conn);
          dot.className = "dot " + dotClass;
          lab.textContent = label;
        };
        if (state.conn === "connecting") {
          setConn("connecting", "Connecting…", "pulsing");
          return;
        }
        if (state.conn === "offline") {
          setConn("offline", "Off-device", "warn");
          $("stat-installed").innerHTML = '<span class="muted" style="font-size:14px;font-weight:500">—</span>';
          $("stat-running").innerHTML = '<span class="muted" style="font-size:14px;font-weight:500">—</span>';
          $("stat-mode").innerHTML = '<span class="muted" style="font-size:13px;font-weight:500">off-device</span>';
          $("stat-eval").innerHTML = '<span class="muted">control plane unavailable</span>';
          return;
        }
        // connected
        setConn("connected", "agentd ready", "ok");
        if (!s) return;
        $("stat-installed").innerHTML = '<span class="accent">' + esc(s.installedCount) + '</span> <small>capsules</small>';
        $("stat-running").innerHTML = '<span class="ok">' + esc(s.runningCount) + '</span> <small>active</small>';
        $("stat-mode").textContent = s.mode;
        $("stat-eval").textContent = s.evalSummary;
      }

      // ---- data loads (only valid once connected) ----
      async function loadStatus() {
        const status = await control("GET", "/control/status");
        state.status = status;
        renderStats();
        report("status", { running: status.runningCount, installed: status.installedCount, ready: status.ready });
        return status;
      }
      async function loadApps() {
        const { apps } = await control("GET", "/control/apps");
        state.apps = apps || [];
        renderList();
        renderDetail();
        report("list", state.apps.map((a) => a.id + ":" + (a.running ? "running" : a.installState)));
      }
      async function loadLogs(id) {
        const out = $("d-logs");
        if (out) out.innerHTML = '<div class="logs-state"><span class="spin"></span>loading…</div>';
        const { lines } = await control("GET", "/control/apps/" + encodeURIComponent(id) + "/logs?limit=200");
        if (!out) return;
        out.innerHTML = (lines || []).map((l) =>
          '<div class="l ' + esc(l.level) + '"><span class="ts">' + esc((l.ts || "").replace("T", " ").replace("Z", "").slice(5, 19)) +
          '</span><span class="m">' + esc(l.message) + "</span></div>"
        ).join("") || '<div class="logs-state">no log lines yet</div>';
        report("logs", { id, count: (lines || []).length });
      }

      async function refreshData() {
        await Promise.all([loadStatus(), loadApps()]);
        if (state.selectedId && $("d-logs")) await loadLogs(state.selectedId);
      }

      // Render a clean "Control plane not connected" state: a styled empty state with a Retry button,
      // NOT an endless "connecting…/Loading apps…/—". Called whenever a control call reports the plane is
      // unreachable (no agentd / browser-only / timeout). Resolving the plane later (Retry) clears it.
      function renderDisconnected(reason) {
        // Header pill → unreachable.
        $("node-dot").className = "dot bad";
        $("node-label").textContent = "control plane not connected";
        // Stat strip → dashes (we have no data), but no longer a "loading" implication.
        $("stat-installed").textContent = "—";
        $("stat-running").textContent = "—";
        $("stat-mode").textContent = "—";
        $("stat-eval").textContent = "—";
        // List pane → the empty/offline state with a Retry.
        const host = $("app-list");
        host.innerHTML =
          '<div class="empty" data-disconnected="1">' +
            '<div style="font-weight:650;color:var(--c-text-soft);margin-bottom:6px">Control plane not connected</div>' +
            '<div style="margin-bottom:14px">' + esc(reason || "agentd is not reachable from here.") + '</div>' +
            '<button class="btn primary" id="reconnect-btn" type="button">Retry</button>' +
          '</div>';
        const rc = document.getElementById("reconnect-btn");
        if (rc) rc.addEventListener("click", () => { report("reconnect.click"); refreshAll(); });
        // Detail pane → benign empty.
        $("detail-body").hidden = true;
        $("detail-empty").hidden = false;
        report("disconnected", reason || "");
      }

      async function refreshAll() {
        // Show an honest in-flight state on (re)connect so the user knows it's working, not stuck.
        $("node-label").textContent = "connecting…";
        $("node-dot").className = "dot";
        try {
          await Promise.all([loadStatus(), loadApps()]);
          if (state.selectedId) await loadLogs(state.selectedId);
          window.__CONSOLE__.error = null;
        } catch (e) {
          // Unreachable plane → the clean disconnected state (with Retry). A real error the plane DID
          // answer → surface it as a toast but still leave the UI in a settled (not "loading") state.
          if (e && e.disconnected) {
            window.__CONSOLE__.error = e.message;
            renderDisconnected(e.message);
          } else {
            window.__CONSOLE__.error = e.message;
            report("error", e.message);
            toast("Control plane error: " + e.message, true);
            // Don't leave "Loading apps…" up forever on a hard error either.
            if ($("app-list").innerHTML.indexOf("Loading apps…") !== -1) {
              $("app-list").innerHTML = '<div class="empty">Control plane error: ' + esc(e.message) + '</div>';
            }
            $("node-dot").className = "dot bad";
            $("node-label").textContent = "agentd error";
          }
        }
      }

      async function selectApp(id) {
        state.selectedId = id;
        if (document.body.clientWidth <= 880) $("body").classList.add("detail-open");
        renderList(); renderDetail();
        try { await loadLogs(id); }
        catch (e) { const out = $("d-logs"); if (out) out.innerHTML = '<div class="logs-state" style="color:var(--c-err)">log error: ' + esc(e.message) + "</div>"; }
      }

      // ---- lifecycle actions ----
      async function doStart(id, btn) {
        report("start.click", id);
        await withBusy(btn, async () => {
          try {
            const r = await control("POST", "/control/apps/" + encodeURIComponent(id) + "/start");
            report("start.result", { id, outcome: r.outcome });
            if (r.outcome === "rejected") toast("Start rejected: " + (r.reason || "denied"), true);
            else if (r.outcome === "noop") toast(id + " is already running");
            else toast("Started " + id);
            await loadStatus(); await loadApps();
            if (state.selectedId === id && $("d-logs")) await loadLogs(id);
          } catch (e) { report("start.error", e.message); toast("Start failed: " + e.message, true); }
        });
      }
      async function doStop(id, btn) {
        report("stop.click", id);
        await withBusy(btn, async () => {
          try {
            const r = await control("POST", "/control/apps/" + encodeURIComponent(id) + "/stop");
            report("stop.result", { id, outcome: r.outcome });
            toast(r.outcome === "noop" ? (id + " was not running") : ("Stopped " + id));
            await loadStatus(); await loadApps();
            if (state.selectedId === id && $("d-logs")) await loadLogs(id);
          } catch (e) { report("stop.error", e.message); toast("Stop failed: " + e.message, true); }
        });
      }

      // ---- event wiring (delegated on the persistent #body container) ----
      $("body").addEventListener("click", (e) => {
        const actBtn = e.target.closest("button[data-act]");
        if (actBtn) {
          e.stopPropagation();
          const id = actBtn.getAttribute("data-id");
          if (actBtn.getAttribute("data-act") === "start") doStart(id, actBtn); else doStop(id, actBtn);
          return;
        }
        const row = e.target.closest(".app-row");
        if (row) selectApp(row.getAttribute("data-app-id"));
      });

      function wireDetailButtons() {
        const start = $("d-start"), stop = $("d-stop"), reload = $("d-logs-refresh");
        if (start) start.addEventListener("click", () => state.selectedId && doStart(state.selectedId, start));
        if (stop) stop.addEventListener("click", () => state.selectedId && doStop(state.selectedId, stop));
        if (reload) reload.addEventListener("click", () => state.selectedId && withBusy(reload, () => loadLogs(state.selectedId)));
      }
      wireDetailButtons();

      $("refresh-btn").addEventListener("click", () => {
        report("refresh.click");
        // Refresh re-runs the full connect lifecycle, so it recovers from offline → connected too.
        withBusy($("refresh-btn"), connect);
      });

      // ---- the CONNECT lifecycle: connecting → connected | offline ----
      // One bounded probe (GET /control/status) decides the terminal state. A timeout guarantees we
      // never hang in "connecting". On success → connected + populate; on "unreachable" → offline
      // takeover; on a real error → error takeover.
      async function connect() {
        state.conn = "connecting";
        state.lastError = null;
        renderStats();
        ensureMainLayout();
        renderListSkeleton();
        // reset stat skeletons
        $("stat-installed").innerHTML = '<span class="skel"></span>';
        $("stat-running").innerHTML = '<span class="skel"></span>';
        $("stat-mode").innerHTML = '<span class="skel lg"></span>';
        $("stat-eval").innerHTML = '<span class="skel lg"></span>';

        try {
          // Probe with a hard timeout. This is the single connectivity gate.
          await control("GET", "/control/status", undefined, PROBE_TIMEOUT_MS);
        } catch (e) {
          state.lastError = e.message;
          if (e.kind === "unreachable") {
            state.conn = "offline";
            report("offline", e.message);
            renderStats();
            showStatePanel("offline");
            return;
          }
          state.conn = "error";
          report("connect.error", e.message);
          renderStats(); // pill shows an error tone via the offline branch fallback
          // For a transport error we still surface a panel; treat the pill as not-ready.
          $("node-pill").setAttribute("data-conn", "offline");
          $("node-dot").className = "dot bad";
          $("node-label").textContent = "agentd error";
          showStatePanel("error");
          return;
        }

        // Reachable → connected. Bring back the layout + load real data.
        state.conn = "connected";
        ensureMainLayout();
        renderListSkeleton();
        renderStats();
        try {
          await refreshData();
          if (!state.selectedId && state.apps.length) await selectApp(state.apps[0].id);
        } catch (e) {
          // We were reachable a moment ago; a follow-up failure is a real error, surface it.
          state.lastError = e.message;
          report("refresh.error", e.message);
          toast("Control plane error: " + e.message, true);
        }
        report("connected", { apps: state.apps.length });
      }

      // ---- expose imperative hooks for the headless harness (no reliance on synthetic DOM events) ----
      window.__CONSOLE__.api = { connect, refreshData, loadApps, loadStatus, selectApp, doStart, doStop, loadLogs };

      // ---- boot ----
      (async () => {
        report("boot", { apiOrigin, hasToken: Boolean(authToken), probeTimeoutMs: PROBE_TIMEOUT_MS });

        // Data plane (real puter.js): identify the owner + persist a "last opened" marker via kv. This
        // proves the SAME app uses BOTH planes — fs/kv data plane AND the control plane. These are
        // best-effort and bounded by their own try/catch so they can never block the connect lifecycle.
        try {
          if (window.puter && puter.auth && puter.auth.getUser) {
            state.owner = await puter.auth.getUser();
            report("auth.whoami", state.owner && state.owner.username);
          }
        } catch (e) { report("auth.error", e.message); }
        try {
          if (window.puter && puter.kv) {
            await puter.kv.set("console.lastOpened", new Date().toISOString());
            const seen = await puter.kv.get("console.openCount");
            const next = (Number(seen) || 0) + 1;
            await puter.kv.set("console.openCount", String(next));
            report("kv.persist", { openCount: next });
          }
        } catch (e) { report("kv.error", e.message); }

        // UI plane (postMessage broker) — title the window in the Vita shell. No-op outside the shell.
        try { if (window.puter && puter.ui && puter.ui.setWindowTitle) puter.ui.setWindowTitle("Vita Console"); } catch {}

        await connect();

        window.__CONSOLE__.ready = true;
        report("ready", { conn: state.conn, apps: state.apps.length });
      })().catch((e) => {
        // Last-resort: never leave the UI mid-spin. Fall to the error takeover.
        window.__CONSOLE__.error = e && e.message;
        state.conn = "offline";
        state.lastError = e && e.message;
        report("fatal", e && e.message);
        try { renderStats(); showStatePanel("error"); } catch { /* ignore */ }
        window.__CONSOLE__.ready = true;
      });
    </script>
  </body>
</html>
