<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-sans);color:var(--text);background:transparent;padding:18px}
.mono{font-family:var(--font-mono)}.ico{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.ico svg{width:100%;height:100%;display:block;stroke-width:2}
.dark{background:var(--surface-base);border-radius:10px;padding:16px}.col{display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;font-size:13.5px;font-weight:600;border-radius:var(--radius-control);border:1px solid transparent;cursor:pointer}
.b-primary{background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow-1)}.b-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong);box-shadow:var(--shadow-1)}.b-ghost{background:transparent;color:var(--text-secondary)}.b-destructive{background:var(--danger-subtle);color:var(--danger)}
.ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-control);background:var(--accent-subtle);color:var(--accent)}</style></head><body><div class="col">
<div class="row">
<button class="btn b-primary"><span class="ico" style="width:16px;height:16px"><i data-lucide="terminal"></i></span>Run kernel.ts</button>
<button class="btn b-secondary">Cancel</button>
<button class="btn b-ghost">Skip</button>
<button class="btn b-destructive"><span class="ico" style="width:15px;height:15px"><i data-lucide="trash-2"></i></span>Delete</button>
<span class="ib"><span class="ico" style="width:18px;height:18px"><i data-lucide="settings"></i></span></span>
<button class="btn b-primary" style="opacity:.45;cursor:not-allowed">Disabled</button>
</div>
<div class="dark"><div class="row">
<button class="btn b-primary"><span class="ico" style="width:16px;height:16px"><i data-lucide="terminal"></i></span>Run kernel.ts</button>
<button class="btn b-secondary">Cancel</button>
<button class="btn b-ghost">Skip</button>
<button class="btn b-destructive"><span class="ico" style="width:15px;height:15px"><i data-lucide="trash-2"></i></span>Delete</button>

</div></div></div><script src="../../_vendor/lucide.min.js"></script><script>lucide.createIcons();</script>
