<!-- @dsCard group="Components" viewport="720x250" subtitle="Card container + modal Dialog" name="Surfaces & Dialog" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-sans);color:var(--text);background:transparent;padding:18px}
.dark{background:var(--surface-base);border-radius:10px;padding:16px}.mono{font-family:var(--font-mono)}
.tab{position:relative;padding:10px 14px;font-size:13.5px;color:var(--text-muted)}.tab.on{color:var(--text);font-weight:600}
.tab.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.row{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-md)}
.row.on{background:var(--accent-subtle)}
.tok{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-secondary)}
</style></head><body><div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">
<div style="width:240px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);overflow:hidden">
<div style="padding:12px 16px;border-bottom:1px solid var(--hairline);font-weight:600;font-size:14px">Appearance</div>
<div style="padding:16px;font-size:13px;color:var(--text-secondary)">Theme, accent and density options live here.</div></div>
<div style="width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-3);overflow:hidden">
<div style="padding:18px 20px"><div style="font-size:17px;font-weight:600">Delete kernel.ts?</div><div style="font-size:13px;color:var(--text-secondary);margin-top:7px">This module is imported by 3 processes. This can't be undone.</div></div>
<div style="display:flex;justify-content:flex-end;gap:10px;padding:13px 20px;background:var(--surface-sunken);border-top:1px solid var(--hairline)">
<button style="height:34px;padding:0 14px;border-radius:var(--radius-control);border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:13.5px">Cancel</button>
<button style="height:34px;padding:0 14px;border-radius:var(--radius-control);border:none;background:var(--danger);color:#fff;font-weight:600;font-size:13.5px">Delete</button></div></div>
</div></body></html>
