<!-- @dsCard group="Colors" viewport="720x200" subtitle="TypeScript token palette — every Vita surface speaks code" name="Syntax highlighting" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);color:var(--text);background:transparent;padding:18px}
.mono{font-family:var(--font-mono)}
.wrap{display:flex;gap:14px;flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--text-secondary)}
.lbl b{font-weight:500}.lbl span{color:var(--text-muted)}

</style></head><body><div style="display:flex;gap:14px">
<div style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px"><div class="mono" style="font-size:12.5px;line-height:1.75">
<div style="color:var(--syn-comment)">// boot the typescript kernel</div>
<div><span style="color:var(--syn-keyword)">const</span> <span style="color:var(--syn-ident)">sys</span> <span style="color:var(--syn-punct)">=</span> <span style="color:var(--syn-fn)">await</span> <span style="color:var(--syn-ident)">vita</span><span style="color:var(--syn-punct)">.</span><span style="color:var(--syn-fn)">boot</span><span style="color:var(--syn-punct)">(</span><span style="color:var(--syn-string)">"kernel.ts"</span><span style="color:var(--syn-punct)">)</span></div>
<div><span style="color:var(--syn-keyword)">return</span> <span style="color:var(--syn-ident)">sys</span><span style="color:var(--syn-punct)">.</span><span style="color:var(--syn-ident)">pid</span> <span style="color:var(--syn-punct)">===</span> <span style="color:var(--syn-number)">1</span></div></div><div class="lbl" style="margin-top:8px">LIGHT</div></div>
<div class="theme-dark" style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px"><div class="mono" style="font-size:12.5px;line-height:1.75">
<div style="color:var(--syn-comment)">// boot the typescript kernel</div>
<div><span style="color:var(--syn-keyword)">const</span> <span style="color:var(--syn-ident)">sys</span> <span style="color:var(--syn-punct)">=</span> <span style="color:var(--syn-fn)">await</span> <span style="color:var(--syn-ident)">vita</span><span style="color:var(--syn-punct)">.</span><span style="color:var(--syn-fn)">boot</span><span style="color:var(--syn-punct)">(</span><span style="color:var(--syn-string)">"kernel.ts"</span><span style="color:var(--syn-punct)">)</span></div>
<div><span style="color:var(--syn-keyword)">return</span> <span style="color:var(--syn-ident)">sys</span><span style="color:var(--syn-punct)">.</span><span style="color:var(--syn-ident)">pid</span> <span style="color:var(--syn-punct)">===</span> <span style="color:var(--syn-number)">1</span></div></div><div class="lbl" style="margin-top:8px">DARK</div></div>
</div></body></html>
