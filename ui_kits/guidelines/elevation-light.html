<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);color:var(--text);background:transparent;padding:18px}
.mono{font-family:var(--font-mono)}
.wrap{display:flex;gap:14px;flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--text-secondary)}
.lbl b{font-weight:500}.lbl span{color:var(--text-muted)}

</style></head><body><div style="display:flex;gap:18px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:8px"><div style="width:124px;height:74px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1)"></div><div class="lbl"><b>Raised</b><br><span>--shadow-1</span></div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:124px;height:74px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-2)"></div><div class="lbl"><b>Card</b><br><span>--shadow-2</span></div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:124px;height:74px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-3)"></div><div class="lbl"><b>Popover</b><br><span>--shadow-3</span></div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:124px;height:74px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-window)"></div><div class="lbl"><b>Window</b><br><span>--shadow-window</span></div></div>
</div></body></html>
