<!-- @dsCard group="Colors" viewport="720x180" subtitle="Window, panel & text tokens in the light theme" name="Surfaces · Light" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);color:var(--text);background:transparent;padding:18px}
.mono{font-family:var(--font-mono)}
.wrap{display:flex;gap:14px;flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--text-secondary)}
.lbl b{font-weight:500}.lbl span{color:var(--text-muted)}

</style></head><body><div class="wrap">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--surface-base);border:1px solid var(--border)"></div>
<div class="lbl"><b>--surface-base</b><br><span>#EEF1F6</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--surface);border:1px solid var(--border)"></div>
<div class="lbl"><b>--surface</b><br><span>#FFFFFF</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--surface-sunken);border:1px solid var(--border)"></div>
<div class="lbl"><b>--surface-sunken</b><br><span>#F7F8FA</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--border-strong);border:1px solid var(--border)"></div>
<div class="lbl"><b>--border-strong</b><br><span>#D4D8DE</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--text);border:1px solid var(--border)"></div>
<div class="lbl"><b>--text</b><br><span>#14171C</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--text-secondary);border:1px solid var(--border)"></div>
<div class="lbl"><b>--text-secondary</b><br><span>#4B5563</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--text-muted);border:1px solid var(--border)"></div>
<div class="lbl"><b>--text-muted</b><br><span>#8A94A3</span></div></div>
</div></body></html>
