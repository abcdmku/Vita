<!-- @dsCard group="Brand" viewport="720x180" subtitle="Vita + .ts suffix in accent. App mark is the accent tile + token" name="Wordmark & app mark" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);color:var(--text);background:transparent;padding:18px}
.mono{font-family:var(--font-mono)}
.wrap{display:flex;gap:14px;flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--text-secondary)}
.lbl b{font-weight:500}.lbl span{color:var(--text-muted)}

</style></head><body><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:8px"><div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 26px;display:flex;align-items:baseline;gap:2px"><span style="font-size:34px;font-weight:700;letter-spacing:-.025em;color:var(--text)">Vita</span><span class="mono" style="font-size:18px;font-weight:600;color:var(--accent)">.ts</span></div><div class="lbl" style="text-align:center">Light</div></div>
<div class="theme-dark" style="display:flex;flex-direction:column;gap:8px"><div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 26px;display:flex;align-items:baseline;gap:2px"><span style="font-size:34px;font-weight:700;letter-spacing:-.025em;color:var(--text)">Vita</span><span class="mono" style="font-size:18px;font-weight:600;color:var(--accent)">.ts</span></div><div class="lbl" style="text-align:center;color:var(--text-muted)">Dark</div></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:64px;height:64px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:24px;color:var(--accent-fg);box-shadow:var(--shadow-3)">V</div><div class="lbl">App mark</div></div>
</div></body></html>
