<!-- @dsCard group="Colors" viewport="720x150" subtitle="Status colors + their subtle fills, shared across themes" name="Semantic" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);color:var(--text);background:transparent;padding:18px}
.mono{font-family:var(--font-mono)}
.wrap{display:flex;gap:14px;flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--text-secondary)}
.lbl b{font-weight:500}.lbl span{color:var(--text-muted)}

</style></head><body><div class="wrap">
<div style="display:flex;flex-direction:column;gap:6px"><div style="width:120px;height:46px;border-radius:8px;background:var(--success-subtle);border:1px solid var(--success);display:flex;align-items:center;justify-content:center;color:var(--success);font-size:12px;font-weight:600">Success</div><div class="lbl"><span>--success #1F8A5B</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px"><div style="width:120px;height:46px;border-radius:8px;background:var(--warning-subtle);border:1px solid var(--warning);display:flex;align-items:center;justify-content:center;color:var(--warning);font-size:12px;font-weight:600">Warning</div><div class="lbl"><span>--warning #B5772B</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px"><div style="width:120px;height:46px;border-radius:8px;background:var(--danger-subtle);border:1px solid var(--danger);display:flex;align-items:center;justify-content:center;color:var(--danger);font-size:12px;font-weight:600">Danger</div><div class="lbl"><span>--danger #C44A4A</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px"><div style="width:120px;height:46px;border-radius:8px;background:var(--accent-subtle);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:12px;font-weight:600">Info</div><div class="lbl"><span>--info (accent)</span></div></div>
</div></body></html>
