<!-- @dsCard group="Colors" viewport="720x196" subtitle="The same token roles resolved in the dark theme" name="Surfaces · Dark" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);color:var(--text);background:transparent;padding:18px}
.mono{font-family:var(--font-mono)}
.wrap{display:flex;gap:14px;flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--text-secondary)}
.lbl b{font-weight:500}.lbl span{color:var(--text-muted)}

</style></head><body><div class="theme-dark" style="background:var(--surface-base);padding:18px;border-radius:10px"><div class="wrap">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--surface-base);border:1px solid var(--border)"></div>
<div class="lbl"><b>--surface-base</b><br><span>#0E1116</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--surface);border:1px solid var(--border)"></div>
<div class="lbl"><b>--surface</b><br><span>#161A21</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--surface-raised);border:1px solid var(--border)"></div>
<div class="lbl"><b>--surface-raised</b><br><span>#1C222B</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--border-strong);border:1px solid var(--border)"></div>
<div class="lbl"><b>--border-strong</b><br><span>wht 12%</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--text);border:1px solid var(--border)"></div>
<div class="lbl"><b>--text</b><br><span>#E6E9EF</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--text-secondary);border:1px solid var(--border)"></div>
<div class="lbl"><b>--text-secondary</b><br><span>#AEB8C6</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:80px;height:50px;border-radius:8px;background:var(--text-muted);border:1px solid var(--border)"></div>
<div class="lbl"><b>--text-muted</b><br><span>#8B97A6</span></div></div>
</div></div></body></html>
