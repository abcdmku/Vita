<!-- @dsCard group="Spacing" viewport="720x160" subtitle="Soft for windows & tiles; xs for tiling mode" name="Corner radius" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);color:var(--text);background:transparent;padding:18px}
.mono{font-family:var(--font-mono)}
.wrap{display:flex;gap:14px;flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--text-secondary)}
.lbl b{font-weight:500}.lbl span{color:var(--text-muted)}

</style></head><body><div class="wrap" style="align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:6px"><div style="width:74px;height:58px;background:var(--accent-subtle);border:1.5px solid var(--accent);border-radius:4px;border-bottom-right-radius:0;border-top-left-radius:0"></div><div class="lbl"><b>--radius-xs</b><br><span>4px</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:74px;height:58px;background:var(--accent-subtle);border:1.5px solid var(--accent);border-radius:6px;border-bottom-right-radius:0;border-top-left-radius:0"></div><div class="lbl"><b>--radius-sm</b><br><span>6px</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:74px;height:58px;background:var(--accent-subtle);border:1.5px solid var(--accent);border-radius:8px;border-bottom-right-radius:0;border-top-left-radius:0"></div><div class="lbl"><b>--radius-md</b><br><span>8px</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:74px;height:58px;background:var(--accent-subtle);border:1.5px solid var(--accent);border-radius:12px;border-bottom-right-radius:0;border-top-left-radius:0"></div><div class="lbl"><b>--radius-lg</b><br><span>12px</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:74px;height:58px;background:var(--accent-subtle);border:1.5px solid var(--accent);border-radius:16px;border-bottom-right-radius:0;border-top-left-radius:0"></div><div class="lbl"><b>--radius-xl</b><br><span>16px</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:74px;height:58px;background:var(--accent-subtle);border:1.5px solid var(--accent);border-radius:20px;border-bottom-right-radius:0;border-top-left-radius:0"></div><div class="lbl"><b>--radius-2xl</b><br><span>20px</span></div></div>
</div></body></html>
