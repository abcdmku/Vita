<!-- @startingPoint section="Screens" subtitle="Home — clean desktop: wallpaper, live menu bar & dock (dark)" viewport="1280x800" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="kit.css"><style>html,body{margin:0;width:100%;height:100%;background:#08090c}.v-screen{width:100vw;height:100vh}</style></head><body>
<div class="v-screen theme-dark v-wall-dark" data-vita-screen="desktop" data-vita-action="shell.key" data-vita-event="keydown"><div class="v-menubar"><div style="display:flex;align-items:center;gap:18px"><span class="v-brand">Vita<i>.ts</i></span><div class="v-menus">
<span data-vita-action="menu.toggle" data-vita-event="click" data-vita-menu-id="file" data-vita-bind-class="open:menu.file.open" data-vita-bind-aria-expanded="menu.file.open">File</span>
<span data-vita-action="menu.toggle" data-vita-event="click" data-vita-menu-id="edit" data-vita-bind-class="open:menu.edit.open" data-vita-bind-aria-expanded="menu.edit.open">Edit</span>
<span data-vita-action="menu.toggle" data-vita-event="click" data-vita-menu-id="view" data-vita-bind-class="open:menu.view.open" data-vita-bind-aria-expanded="menu.view.open">View</span>
<span data-vita-action="menu.toggle" data-vita-event="click" data-vita-menu-id="go" data-vita-bind-class="open:menu.go.open" data-vita-bind-aria-expanded="menu.go.open">Go</span>
<span data-vita-action="menu.toggle" data-vita-event="click" data-vita-menu-id="window" data-vita-bind-class="open:menu.window.open" data-vita-bind-aria-expanded="menu.window.open">Window</span>
<span data-vita-action="menu.toggle" data-vita-event="click" data-vita-menu-id="help" data-vita-bind-class="open:menu.help.open" data-vita-bind-aria-expanded="menu.help.open">Help</span>
</div></div>
<div class="v-status"><span class="ico" style="width:15px;height:15px" title="Network connected"><i data-lucide="wifi"></i></span><span class="ico" style="width:19px;height:19px" title="Battery"><i data-lucide="battery-full"></i></span><span class="clk" data-vita-bind-text="statusbar.time">10:24</span></div></div>
<div class="v-dropdown" data-vita-bind-class="show:menu.anyOpen" data-vita-bind-attr-0="style:menu.dropdownStyle">
<div class="v-dropdown-list" data-vita-bind-list="menuItems">
<div class="v-mitem" data-vita-key="item.template" data-vita-action="menu.select" data-vita-event="click" data-vita-bind-class="disabled:item.disabled is-checked:item.checked" data-vita-bind-attr-0="data-vita-item-id:item.id" data-vita-bind-aria-disabled="item.disabled"><span class="v-mitem-label" data-vita-bind-text="item.label">Item</span><span class="v-mitem-acc mono" data-vita-bind-text="item.accelerator"></span></div>
</div></div>
<div class="v-scrim" data-vita-bind-class="show:overlay.open" data-vita-action="overlay.dismiss" data-vita-event="click"></div>
<div class="v-palette" data-vita-bind-class="show:palette.open" data-vita-action="palette.nav" data-vita-event="keydown" data-vita-bind-attr-0="data-vita-highlighted-index:highlightedIndex">
<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--hairline);color:var(--accent)"><span class="ico" style="width:19px;height:19px"><i data-lucide="search"></i></span><span style="flex:1;font-size:16px;color:var(--text-muted)" data-vita-action="palette.query" data-vita-event="input">Search or run a command…</span><span class="v-chip">⌘K</span></div>
<div style="padding:7px" data-vita-bind-list="results">
<div style="display:flex;align-items:center;gap:12px;padding:8px 11px;border-radius:var(--radius-md)" data-vita-key="command.template" data-vita-action="palette.execute" data-vita-event="click" data-vita-bind-class="is-highlighted:result.highlighted"><span class="v-tok acc" style="width:30px;height:30px"><span class="ico" style="width:16px;height:16px"><i data-lucide="terminal"></i></span></span><div style="flex:1"><div style="font-size:14px;font-weight:500" data-vita-bind-text="result.title">Run kernel.ts</div><div class="mono" style="font-size:11.5px;color:var(--text-muted)" data-vita-bind-text="result.subtitle">TypeScript · main()</div></div><span style="color:var(--accent)"><span class="ico" style="width:15px;height:15px"><i data-lucide="corner-down-left"></i></span></span></div>
</div></div>
<div class="v-dock"><span class="v-dtile on" data-vita-key="vita.app.terminal" data-vita-action="dock.launchOrFocus" data-vita-event="click" data-vita-dock-app-id="vita.app.terminal" data-vita-bind-class="on:dock.vita.app.terminal.active" data-vita-bind-attr-0="aria-pressed:dock.vita.app.terminal.active"><span class="ico" style="width:23px;height:23px"><i data-lucide="terminal"></i></span></span><span class="v-dtile" data-vita-key="vita.app.code" data-vita-action="dock.launchOrFocus" data-vita-event="click" data-vita-dock-app-id="vita.app.code" data-vita-bind-class="on:dock.vita.app.code.active" data-vita-bind-attr-0="aria-pressed:dock.vita.app.code.active"><span class="ico" style="width:23px;height:23px"><i data-lucide="code"></i></span></span><span class="v-dtile" data-vita-key="vita.app.file-manager" data-vita-action="dock.launchOrFocus" data-vita-event="click" data-vita-dock-app-id="vita.app.file-manager" data-vita-bind-class="on:dock.vita.app.file-manager.active" data-vita-bind-attr-0="aria-pressed:dock.vita.app.file-manager.active"><span class="ico" style="width:23px;height:23px"><i data-lucide="folder"></i></span></span><span class="v-dtile" data-vita-key="vita.app.mail" data-vita-action="dock.launchOrFocus" data-vita-event="click" data-vita-dock-app-id="vita.app.mail" data-vita-bind-class="on:dock.vita.app.mail.active" data-vita-bind-attr-0="aria-pressed:dock.vita.app.mail.active"><span class="ico" style="width:23px;height:23px"><i data-lucide="mail"></i></span></span><span class="v-dtile" data-vita-key="vita.app.browser" data-vita-action="dock.launchOrFocus" data-vita-event="click" data-vita-dock-app-id="vita.app.browser" data-vita-bind-class="on:dock.vita.app.browser.active" data-vita-bind-attr-0="aria-pressed:dock.vita.app.browser.active"><span class="ico" style="width:23px;height:23px"><i data-lucide="globe"></i></span></span><span class="v-dtile" data-vita-key="vita.app.activity" data-vita-action="dock.launchOrFocus" data-vita-event="click" data-vita-dock-app-id="vita.app.activity" data-vita-bind-class="on:dock.vita.app.activity.active" data-vita-bind-attr-0="aria-pressed:dock.vita.app.activity.active"><span class="ico" style="width:23px;height:23px"><i data-lucide="activity"></i></span></span><span class="v-dsep"></span><span class="v-dtile" data-vita-key="vita.app.settings" data-vita-action="dock.launchOrFocus" data-vita-event="click" data-vita-dock-app-id="vita.app.settings" data-vita-bind-class="on:dock.vita.app.settings.active" data-vita-bind-attr-0="aria-pressed:dock.vita.app.settings.active"><span class="ico" style="width:23px;height:23px"><i data-lucide="settings"></i></span></span></div></div><script src="../_vendor/lucide.min.js"></script><script type="module" src="runtime/bootstrap.js"></script></body></html>
