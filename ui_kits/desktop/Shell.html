<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="kit.css"><style>html,body{margin:0}</style></head><body>
<div class="v-screen theme-dark v-wall-dark" data-vita-screen="desktop/shell"><div class="v-menubar"><div style="display:flex;align-items:center;gap:18px"><span class="v-brand">Vita<i>.ts</i></span><div class="v-menus"><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span></div></div>
<div class="v-status"><span class="ico" style="width:15px;height:15px"><i data-lucide="wifi"></i></span><span class="ico" style="width:19px;height:19px"><i data-lucide="battery-full"></i></span><span class="clk">10:24</span></div></div>
<div class="v-win" style="left:230px;top:100px;width:820px;height:560px">
<div class="v-tt" style="gap:0;padding:0 12px;justify-content:flex-start">
<div class="v-dots" style="margin-right:14px"><span></span><span></span><span></span></div>
<span style="height:36px;display:flex;align-items:center;gap:8px;padding:0 13px;border-bottom:2px solid var(--accent);color:var(--text)"><span style="color:var(--accent)"><span class="ico" style="width:13px;height:13px"><i data-lucide="terminal"></i></span></span><span class="mono" style="font-size:12px" data-vita-bind-text="shell.activeTitle">kernel</span></span>
<span style="height:36px;display:flex;align-items:center;gap:8px;padding:0 13px;color:var(--text-muted)"><span class="mono" style="font-size:12px">build</span></span>
<span style="height:36px;display:flex;align-items:center;padding:0 11px;color:var(--text-faint)" data-vita-action="shell.newTab"><span class="ico" style="width:14px;height:14px"><i data-lucide="plus"></i></span></span></div>
<div class="v-content" style="background:var(--surface-sunken);padding:18px 20px;font-family:var(--font-mono);font-size:13px;line-height:1.95" data-vita-bind-list="shell.output">
<div data-vita-key="template"></div>
</div>
<div style="height:28px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--hairline);background:var(--surface-raised);font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)"><span style="color:var(--accent)" data-vita-bind-text="shell.cwd">~/vita</span><span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--success)"><span class="ico" style="width:12px;height:12px"><i data-lucide="git-branch"></i></span>main</span><span>TS 5.9</span><span style="color:var(--text-faint)" data-vita-bind-text="shell.exitCode">UTF-8</span></div>
</div>
<div class="v-dock"><span class="v-dtile on"><span class="ico" style="width:23px;height:23px"><i data-lucide="terminal"></i></span></span><span class="v-dtile"><span class="ico" style="width:23px;height:23px"><i data-lucide="code"></i></span></span><span class="v-dtile"><span class="ico" style="width:23px;height:23px"><i data-lucide="folder"></i></span></span><span class="v-dtile"><span class="ico" style="width:23px;height:23px"><i data-lucide="mail"></i></span></span><span class="v-dtile"><span class="ico" style="width:23px;height:23px"><i data-lucide="globe"></i></span></span><span class="v-dsep"></span><span class="v-dtile"><span class="ico" style="width:23px;height:23px"><i data-lucide="settings"></i></span></span></div></div><script src="../_vendor/lucide.min.js"></script><script type="module" src="runtime/bootstrap.js"></script></body></html>
