<!-- @dsCard group="Desktop OS" viewport="1280x800" subtitle="Sign-in over a dark glow wallpaper" name="Lock / Login" -->
<!-- @startingPoint section="Screens" subtitle="Sign-in over a dark glow wallpaper" viewport="1280x800" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="kit.css"><style>html,body{margin:0}</style></head><body>
<div class="v-screen theme-dark" data-vita-screen="desktop/lock" data-vita-bind-class="is-unlocked:lock.unlocked is-authenticating:lock.authenticating"><div style="position:absolute;inset:0;background:radial-gradient(900px 620px at 50% 16%,rgba(59,130,246,.20),transparent 58%),radial-gradient(700px 520px at 82% 96%,rgba(124,92,246,.14),transparent 60%),linear-gradient(160deg,#11151c,#080a0e)"></div>
<div style="position:absolute;top:40px;left:0;right:0;text-align:center"><div style="font-size:14px;color:rgba(238,242,247,.7)" data-vita-bind-text="lock.date">Tuesday, June 25</div><div style="font-weight:300;font-size:84px;letter-spacing:-.03em;line-height:1.05;color:#fff" data-vita-bind-text="lock.time">10:24</div></div>
<div style="position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:18px">
<div style="width:84px;height:84px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:34px;color:var(--accent-fg);box-shadow:var(--glow-accent),var(--shadow-3)" data-vita-bind-text="lock.initials">V</div>
<div style="font-size:18px;font-weight:600;color:#fff" data-vita-bind-text="lock.user">Vita User</div>
<div style="display:flex;align-items:center;gap:10px;width:288px;height:42px;padding:0 8px 0 14px;background:rgba(255,255,255,.10);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.18);border-radius:var(--radius-pill);color:rgba(255,255,255,.8)"><span class="ico" style="width:16px;height:16px"><i data-lucide="lock"></i></span>
<span style="flex:1;letter-spacing:3px;color:#fff;font-size:14px">••••••••</span>
<span style="width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent-fg)" data-vita-action="lock.submit" data-vita-credential="password"><span class="ico" style="width:16px;height:16px"><i data-lucide="arrow-right"></i></span></span></div>
<div style="font-size:12.5px;color:rgba(238,242,247,.6);display:flex;align-items:center;gap:7px"><span class="ico" style="width:15px;height:15px"><i data-lucide="fingerprint"></i></span><span data-vita-bind-text="lock.error">Touch ID or enter password</span><span aria-hidden="true" style="display:none" data-vita-bind-text="lock.remainingAttempts">5</span></div>
</div>
<div style="position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:center;gap:26px;color:rgba(238,242,247,.7);font-size:12.5px">
<span style="display:flex;align-items:center;gap:8px"><span style="width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center"><span class="ico" style="width:15px;height:15px"><i data-lucide="moon"></i></span></span>Sleep</span><span style="display:flex;align-items:center;gap:8px"><span style="width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center"><span class="ico" style="width:15px;height:15px"><i data-lucide="rotate-cw"></i></span></span>Restart</span><span style="display:flex;align-items:center;gap:8px"><span style="width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center"><span class="ico" style="width:15px;height:15px"><i data-lucide="power"></i></span></span>Shut Down</span>
</div></div><script src="../_vendor/lucide.min.js"></script><script type="module" src="runtime/bootstrap.js"></script></body></html>
