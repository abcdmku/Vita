<!doctype html>
<!--
  Vita kiosk entry page — the minimal page the LOCAL (kiosk) face serves at `/`.

  A stock kiosk browser (cage + chromium --kiosk, see KIOSK.md) loads this from
  http://127.0.0.1:<localPort>/. It is intentionally minimal: it confirms the local face is reachable,
  loads the vendored Apache-2.0 puter.js SDK (offline, same-origin), and is the mount point for the
  desktop launcher that opens Puter apps in sandboxed iframes pointed at the SAME-ORIGIN /api.

  The network (remote) face serves the SAME page, but the backend's owner-token gate (backend.ts)
  requires the owner token before this page is served to a remote client.

  No custom compositor. All data + capability enforcement is in the backend.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vita</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e0f13; color: #e6e8ee; font: 14px system-ui, sans-serif; }
    .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; }
    .badge { font-size: 13px; color: #8b8f9c; }
    .ok { color: #4ade80; } .err { color: #f87171; }
    h1 { font-size: 22px; margin: 0; letter-spacing: 0.5px; }
    code { background: #1a1c22; padding: 2px 6px; border-radius: 4px; }
  </style>
  <!-- Vendored, offline, Apache-2.0 puter.js client SDK (no runtime CDN). Same-origin on the local face. -->
  <script src="/_vendor/puter/v2.js"></script>
  <!-- LOCAL-FACE session bootstrap: the platform serves /session.js ONLY on the trust-on-host kiosk
       face. It points puter.js at our same-origin /api and hands it the minted vita.kiosk app-session
       token, so whoami/fs/kv carry the bearer and clear the always-on per-app gate (no 401). On the
       network face /session.js 404s, so the SDK stays unauthenticated there (owner-gated separately). -->
  <script src="/session.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>Vita</h1>
    <div class="badge" id="face">local kiosk face</div>
    <div class="badge" id="sdk">checking puter.js…</div>
    <div class="badge" id="api">checking api_origin…</div>
  </div>
  <script>
    (function () {
      var sdkEl = document.getElementById("sdk");
      var apiEl = document.getElementById("api");

      var hasSdk = typeof window.puter === "object" && window.puter !== null;
      sdkEl.textContent = hasSdk ? "puter.js loaded" : "puter.js MISSING";
      sdkEl.className = "badge " + (hasSdk ? "ok" : "err");

      // Authenticated probe over the trust-on-host LOCAL face. /session.js (loaded above) set puter.js's
      // api_origin to our same-origin /api and its authToken to the minted vita.kiosk session, so the
      // SDK's whoami carries the bearer and clears the always-on per-app gate. A successful whoami here is
      // the proof the token injection works (the previous tokenless fetch got 401 from the gate).
      var whoamiEl = document.createElement("div");
      whoamiEl.className = "badge";
      whoamiEl.id = "whoami";
      apiEl.parentNode.appendChild(whoamiEl);
      whoamiEl.textContent = "whoami: calling…";

      function reportWhoami(u) {
        apiEl.textContent = "api_origin authenticated (SDK)";
        apiEl.className = "badge ok";
        whoamiEl.textContent = "whoami: " + (u && u.username ? u.username : JSON.stringify(u));
        whoamiEl.className = "badge ok";
        // VITA-KIOSK-WHOAMI marker for the boot-log verification (cage/chromium console -> serial via the
        // launcher is not captured, so we also write it where a screenshot can show it).
      }
      function reportWhoamiErr(e) {
        var code = e && (e.status || (e.error && e.error.code)) ;
        whoamiEl.textContent = "whoami FAILED: " + (code || (e && e.message) || "error");
        whoamiEl.className = "badge err";
        apiEl.textContent = "api_origin auth FAILED (HTTP " + (code || "?") + ")";
        apiEl.className = "badge err";
      }
      try {
        if (hasSdk && window.puter.auth && typeof window.puter.auth.whoami === "function") {
          window.puter.auth.whoami().then(reportWhoami).catch(reportWhoamiErr);
        } else {
          // Fall back to a direct bearer fetch using the injected token (still proves the gate clears).
          var t = (window.__vitaSession && window.__vitaSession.hasToken && window.puter && window.puter.authToken) || "";
          fetch("/api/whoami", { headers: t ? { Authorization: "Bearer " + t } : {} })
            .then(function (r) { return r.ok ? r.json().then(reportWhoami) : reportWhoamiErr({ status: r.status }); })
            .catch(reportWhoamiErr);
        }
      } catch (e) { reportWhoamiErr(e); }
    })();
  </script>
</body>
</html>
