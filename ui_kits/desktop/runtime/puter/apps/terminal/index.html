<!doctype html>
<!--
  Vita Terminal — a real terminal, in the browser, wired to a shell on the node.

  This is a Puter app (a sandboxed web page) that mounts xterm.js and opens a `/pty` WEBSOCKET on Vita's
  local api_origin. The websocket is gated on the `exec` capability (server.ts → exec-plane.ts): only
  this app — granted `exec` at launch — can open it; everything else is 401/403. Over that socket it
  pumps the exec wire protocol: keystrokes → {t:"stdin"} frames; {t:"stdout"}/{t:"stderr"} frames →
  term.write. Commands run inside a hardened, cgroup-gated capsule on the node (on-device) or a
  scrubbed dev sandbox (preview) — see exec-plane.ts.

  LOOK & FEEL — the owner handoff "Shell" aesthetic (ui_kits/desktop/Shell.html): a syntax-highlighted
  TypeScript REPL. The chrome (neutral-dot title bar, a `surface-sunken` content area, the `›` accent
  prompt + solid accent block cursor, the syntax-highlighted intro, and the status footer
  `~/vita · git-branch main · TS 5.9 · UTF-8`) is all driven by the canonical design tokens — we link the
  same /ui_kits/styles.css (Geist Mono + the `--syn-*` syntax ladder + the `.theme-dark` surface ladder)
  and the /ui_kits/vita-app-theme.css bridge the shell + every first-party app share. The LIVE xterm grid
  reads the same tokens for its theme (background `--surface-sunken`, cursor `--accent`, foreground/green
  from the syntax ladder), so the live pty output matches the mock byte-for-byte in spirit.

  The app reads two launch params from its URL (set by the launcher / harness):
    puter.api_origin   — the api_origin base (we derive the ws:// /pty URL from it)
    puter.auth.token   — the opaque owner token (rides the /pty query string; a browser WebSocket
                         cannot set an Authorization header). The exec gate validates it.
-->
<html class="theme-dark">
<head>
  <meta charset="utf-8" />
  <title>Vita Terminal</title>
  <!-- Vendored, offline, MIT-licensed xterm.js (no runtime CDN). -->
  <link rel="stylesheet" href="/_vendor/xterm/xterm.css" />
  <!-- Shared design-system: tokens (Geist Mono, --syn-*, the dark surface ladder) THEN the bridge.
       Both are vendored/offline (no CDN); served from the repo's ui_kits dir by the platform server. -->
  <link rel="stylesheet" href="/ui_kits/styles.css" />
  <link rel="stylesheet" href="/ui_kits/vita-app-theme.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Window chrome — neutral-dot title bar (matches WindowChrome.jsx / Shell.html). ── */
    #bar {
      height: 38px; flex-shrink: 0;
      display: flex; align-items: center; gap: 11px;
      padding: 0 14px;
      background: var(--surface-raised);
      border-bottom: 1px solid var(--hairline);
      user-select: none;
    }
    #bar .dots { display: flex; gap: 8px; }
    #bar .dots span {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--border-strong);
      box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25), 0 1px 1px rgba(0,0,0,.15);
    }
    #bar .ticon { color: var(--accent); display: inline-flex; margin-left: 3px; }
    #bar .title {
      font-family: var(--font-mono); font-size: 12px; font-weight: 500;
      color: var(--text-secondary);
    }
    #bar .meta { margin-left: auto; font-size: 11px; color: var(--text-muted); }
    #bar .meta .live {
      display: inline-flex; align-items: center; gap: 5px;
    }
    #bar .meta .live .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-faint);
    }
    #bar .meta .live.up .dot {
      background: var(--success);
      box-shadow: 0 0 8px color-mix(in srgb, var(--success) 70%, transparent);
    }
    #bar .meta .live.denied .dot { background: var(--danger); box-shadow: 0 0 8px color-mix(in srgb, var(--danger) 70%, transparent); }

    /* ── Content — the sunken REPL surface. The syntax-highlighted intro sits on top; the live xterm
         grid fills the rest. Both share the same surface so the seam is invisible. ── */
    #content {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      background: var(--surface-sunken);
      padding: 14px 18px 6px;
      overflow: hidden;
    }
    #intro {
      font-family: var(--font-mono); font-size: 13px; line-height: 1.95;
      flex-shrink: 0; padding-bottom: 6px;
    }
    #intro .c { color: var(--syn-comment); }
    #intro .k { color: var(--syn-keyword); }
    #intro .s { color: var(--syn-string); }
    #intro .n { color: var(--syn-number); }
    #intro .f { color: var(--syn-fn); }
    #intro .p { color: var(--syn-punct); }
    #intro .id { color: var(--syn-ident); }
    #intro .ok { color: var(--success); }
    #intro .prompt { color: var(--accent); user-select: none; }
    /* The solid accent BLOCK cursor (matches Shell.html's caret block). */
    #intro .caret {
      display: inline-block; width: 8px; height: 15px;
      background: var(--accent); vertical-align: -2px;
      animation: vita-caret 1.05s steps(1) infinite;
    }
    @keyframes vita-caret { 50% { opacity: 0; } }

    /* The live terminal grid — flush to the same sunken surface; xterm paints its own background from
       the theme we hand it (also --surface-sunken), so there is no visible seam with #intro. */
    #term { flex: 1; min-height: 0; }
    .xterm { height: 100%; }
    .xterm .xterm-viewport { background: transparent !important; }

    /* ── Status footer — ~/vita · git-branch main · TS 5.9 · UTF-8. ── */
    #footer {
      height: 28px; flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 0 14px;
      border-top: 1px solid var(--hairline);
      background: var(--surface-raised);
      font-family: var(--font-mono); font-size: 10.5px;
      color: var(--text-muted);
      user-select: none;
    }
    #footer .cwd { color: var(--accent); }
    #footer .branch {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--success);
    }
    #footer .branch svg { display: block; }
    #footer .enc { color: var(--text-faint); }
  </style>
  <script src="/_vendor/xterm/xterm.js"></script>
  <script src="/_vendor/xterm/addon-fit.js"></script>
</head>
<body>
  <div id="bar">
    <span class="dots"><span></span><span></span><span></span></span>
    <span class="ticon" title="terminal" aria-hidden="true">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
    </span>
    <span class="title">kernel — ~/vita</span>
    <span class="meta"><span class="live" id="live"><span class="dot"></span><span id="meta">connecting…</span></span></span>
  </div>

  <div id="content">
    <!-- The syntax-highlighted REPL intro (the Shell.html banner). Static; the live pty renders below. -->
    <div id="intro">
      <div><span class="c">// Vita shell — a TypeScript REPL with full system access</span></div>
      <div><span class="prompt">›</span> <span class="k">import</span> <span class="p">{</span> Kernel <span class="p">}</span> <span class="k">from</span> <span class="s">"./kernel.ts"</span></div>
      <div><span class="prompt">›</span> <span class="k">const</span> <span class="id">k</span> <span class="p">=</span> <span class="k">new</span> <span class="f">Kernel</span><span class="p">()</span></div>
      <div><span class="prompt">›</span> <span class="k">await</span> <span class="id">k</span><span class="p">.</span><span class="f">boot</span><span class="p">(</span><span class="s">"init.ts"</span><span class="p">)</span></div>
      <div class="ok">&nbsp;&nbsp;✓ kernel ready · <span class="n">0.42s</span></div>
      <div class="ok">&nbsp;&nbsp;✓ compositor online · <span class="n">60fps</span></div>
      <div><span class="prompt">›</span> <span class="id">k</span><span class="p">.</span><span class="f">shell</span><span class="p">()</span> <span class="c">// live pty ↓</span></div>
      <div><span class="prompt">›</span> <span class="caret"></span></div>
    </div>
    <div id="term"></div>
  </div>

  <div id="footer">
    <span class="cwd">~/vita</span>
    <span class="branch">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
      <span id="branch">main</span>
    </span>
    <span>TS 5.9</span>
    <span class="enc">UTF-8</span>
  </div>

  <script>
    // Expose state for the headless/browser verification to assert against.
    window.__VITA_TERM__ = { connected: false, ready: false, runtime: null, lastError: null, output: "" };

    // ---- read launch params (the SDK isn't needed for exec; we read the URL directly) ----
    const params = new URLSearchParams(location.search);
    function param(name) {
      // accept both "puter.x" and "x"
      return params.get("puter." + name) || params.get(name) || "";
    }
    const apiOrigin = param("api_origin") || (location.origin + "/api");
    const token = param("auth.token") || param("auth_token") || "";

    // Derive the ws(s):// /pty URL from the api_origin (http→ws, https→wss). The token rides the query
    // string because a browser WebSocket cannot set headers; the exec gate validates it server-side.
    function ptyUrl() {
      let base;
      try { base = new URL(apiOrigin, location.href); } catch (e) { base = new URL(location.origin + "/api"); }
      const wsProto = base.protocol === "https:" ? "wss:" : "ws:";
      // /api/.. → the server mounts /pty at the ROOT (not under the api prefix), so target the origin.
      return wsProto + "//" + base.host + "/pty?auth_token=" + encodeURIComponent(token);
    }

    const live = document.getElementById("live");
    const meta = document.getElementById("meta");

    // Resolve a CSS custom property off the live cascade so the xterm grid matches the token theme
    // exactly (no second hardcoded palette to drift). Falls back to a sane default if unresolved.
    function tok(name, fallback) {
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    }

    const term = new Terminal({
      cursorBlink: true,
      fontFamily: "var(--font-mono), 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
      fontSize: 13,
      // Wire the live grid off the SAME design tokens the chrome uses: sunken surface, accent cursor,
      // the syntax ladder's ident/green/red for foreground + stderr.
      theme: {
        background: tok("--surface-sunken", "#11151b"),
        foreground: tok("--syn-ident", "#cdd5e0"),
        cursor: tok("--accent", "#4f9dff"),
        cursorAccent: tok("--surface-sunken", "#11151b"),
        green: tok("--syn-string", "#5bbf86"),
        brightGreen: tok("--success", "#5bbf86"),
        red: tok("--danger", "#f08a8a"),
        yellow: tok("--syn-number", "#e0a86b"),
        blue: tok("--syn-fn", "#7fd99a"),
        magenta: tok("--syn-keyword", "#c08bff"),
        brightBlack: tok("--syn-comment", "#5d6877"),
      },
      convertEol: false,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("term"));
    try { fit.fit(); } catch (e) {}
    term.writeln("\x1b[90mVita Terminal — connecting to the node…\x1b[0m");

    let ws;
    function connect() {
      try {
        ws = new WebSocket(ptyUrl());
      } catch (e) {
        fail("could not open websocket: " + e.message);
        return;
      }

      ws.onopen = () => {
        window.__VITA_TERM__.connected = true;
        live.classList.remove("denied");
        live.classList.add("up");
        meta.textContent = "connected";
      };

      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.t === "ready") {
          window.__VITA_TERM__.ready = true;
          window.__VITA_TERM__.runtime = msg.runtime;
          meta.textContent = msg.runtime + " · " + (msg.cwd || "~");
          term.writeln("\x1b[90mconnected to capsule " + (msg.capsule || "?") + " (" + msg.runtime + ")\x1b[0m");
        } else if (msg.t === "stdout") {
          window.__VITA_TERM__.output += msg.data;
          term.write(msg.data);
        } else if (msg.t === "stderr") {
          window.__VITA_TERM__.output += msg.data;
          term.write("\x1b[31m" + msg.data + "\x1b[0m");
        } else if (msg.t === "exit") {
          term.writeln("\r\n\x1b[90m[process exited code=" + msg.code + (msg.signal ? " signal=" + msg.signal : "") + "]\x1b[0m");
        } else if (msg.t === "error") {
          window.__VITA_TERM__.lastError = msg.message;
          term.writeln("\r\n\x1b[31mexec error: " + msg.message + "\x1b[0m");
        }
      };

      ws.onerror = () => { fail("websocket error (exec denied? gate refused the upgrade)"); };
      ws.onclose = (ev) => {
        live.classList.remove("up");
        // A 1006/abnormal close right after a refused HTTP upgrade is how the exec gate's 401/403 shows
        // up to the browser (no 101). Surface it so the verification can read DENIED.
        if (!window.__VITA_TERM__.connected) {
          fail("connection refused before open (code " + ev.code + ") — exec capability likely denied");
        } else {
          meta.textContent = "disconnected";
        }
      };
    }

    function fail(message) {
      window.__VITA_TERM__.lastError = message;
      live.classList.remove("up");
      live.classList.add("denied");
      meta.textContent = "denied";
      term.writeln("\r\n\x1b[31m" + message + "\x1b[0m");
    }

    // keystrokes → stdin frames
    term.onData((data) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ t: "stdin", data }));
      }
    });

    // geometry → resize frames
    function sendResize() {
      try { fit.fit(); } catch (e) {}
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ t: "resize", cols: term.cols, rows: term.rows }));
      }
    }
    window.addEventListener("resize", sendResize);

    // A test hook: type a command + Enter programmatically (the browser verification drives this so it
    // doesn't depend on focus/keyboard timing). Mirrors what onData would emit for each char.
    window.__vitaTermType = function (line) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return false;
      ws.send(JSON.stringify({ t: "stdin", data: line + "\r" }));
      return true;
    };

    connect();
  </script>
</body>
</html>
