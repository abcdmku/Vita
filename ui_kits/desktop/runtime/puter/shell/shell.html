<!doctype html>
<!--
  Vita multi-window SHELL — served at the kiosk URL (the on-device local face and the dev harness
  both serve this page). It hosts MULTIPLE app windows in one desktop: Vita's own apps (Vita Desk,
  the deploy console) AND real third-party Puter apps (serverless-todo, notepad), each in a managed,
  draggable/resizable/closable window, launched from the dock's app launcher.

  How it differs from kiosk-entry.html: that page WAS the single full-screen Vita Desk app. THIS page
  is the window manager + dock + launcher that hosts Vita Desk (and everything else) as a WINDOW.

  Licensing: only /_vendor/puter/v2.js (Apache-2.0 puter.js SDK) and the two third-party apps under
  /apps/* (each MIT, under their own LICENSE) are third-party. The shell itself (shell.js, this page,
  the window manager + broker + api_origin) is Vita's own code. No AGPL Puter desktop is shipped.

  The shell does NOT load puter.js itself — only the app IFRAMES do. The shell is the postMessage
  PARENT (the broker) those iframes talk to.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vita Desktop</title>
  <link rel="stylesheet" href="/ui_kits/styles.css" />
  <link rel="stylesheet" href="/ui_kits/desktop/kit.css" />
  <!-- Shared design-system bridge: maps canonical tokens onto the --vita-* namespace the apps read,
       plus the shared first-party component look. Linked LAST so it can resolve the tokens above. -->
  <link rel="stylesheet" href="/ui_kits/vita-app-theme.css" />
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;rect width='16' height='16' rx='4' fill='%235b8cff'/&gt;&lt;/svg&gt;" />
  <style>
    /* ---------------------------------------------------------------------------------------------
       Vita DESKTOP SHELL layout. This is the LIVE multi-window desktop (not a static design-canvas
       mockup). kit.css sizes `.v-screen` to a fixed 1280x800 design canvas for the mockup screens
       (Files.html, Activity.html, …); that fixed size is WRONG for the live shell, which must fill
       the real display (e.g. the on-device 1920x1440 CEF surface). We therefore own the shell's
       layout HERE, scoped to `.v-desktop-shell`, and force full-viewport so it can never collapse to
       the 1280x800 canvas regardless of CSS cascade/order on-device. `!important` is deliberate: the
       on-device build must not be able to clip the desktop to the design canvas.
       --------------------------------------------------------------------------------------------- */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--surface-base, #07090d); }
    html, body { height: 100dvh; }
    /* Desktop wallpaper — a quiet, premium dark field with a faint cool vignette. The accent never
       appears here; the wallpaper's restraint is what lets the chrome + windows read as crisp. */
    .v-desktop-shell.v-screen {
      background:
        radial-gradient(120% 90% at 50% -10%, rgba(90,155,246,.06), transparent 60%),
        radial-gradient(80% 70% at 85% 110%, rgba(90,155,246,.05), transparent 55%),
        linear-gradient(180deg, #0b0e14 0%, #07090d 100%);
    }

    /* The shell root fills the viewport (overrides kit.css `.v-screen{width:1280px;height:800px}`). */
    .v-desktop-shell.v-screen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      overflow: hidden !important;
    }

    /* The desktop area between the system bar (top) and the dock (bottom). App windows mount here. */
    .v-desktop-shell .v-desk-area { position: absolute; inset: 0; }

    /* System bar pinned to the TOP edge, prominent + opaque (not the faint translucent mockup bar). */
    .v-desktop-shell .v-menubar {
      position: absolute; top: 0; left: 0; right: 0;
      height: 44px;
      padding: 0 18px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--surface-panel) 92%, #fff 8%) 0%, var(--surface-panel) 100%);
      border-bottom: 1px solid var(--hairline);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.28);
      backdrop-filter: none; -webkit-backdrop-filter: none;
      z-index: 60;
    }
    .v-desktop-shell .v-brand { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
    .v-desktop-shell .v-brand i { font-size: 11px; color: var(--accent); }
    .v-desktop-shell .v-menus { font-size: 13px; color: var(--text-secondary); }
    .v-desktop-shell .v-status { gap: 14px; }
    .v-desktop-shell .v-status .clk {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums;
    }
    /* Connectivity pill on the right of the system bar. */
    .v-desktop-shell .v-net {
      display: inline-flex; align-items: center; gap: 6px;
      font: 600 11.5px var(--font-sans, system-ui); color: var(--text-secondary);
      padding: 3px 9px; border-radius: 999px;
      background: var(--surface-hover); border: 1px solid var(--border);
    }
    .v-desktop-shell .v-net::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 8px color-mix(in srgb, var(--success) 75%, transparent);
    }

    /* Dock pinned to the BOTTOM edge — prominent, clearly visible, larger tiles. */
    .v-desktop-shell .v-dock {
      position: fixed;
      left: 50%;
      bottom: 16px;
      top: auto;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px;
      padding: 9px 13px;
      background: var(--surface-translucent);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
      z-index: 55;
    }
    .v-desktop-shell .v-dtile {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--surface-elevated) 0%, var(--surface-raised) 100%);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 6px rgba(0, 0, 0, 0.4);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; line-height: 1; cursor: pointer; position: relative;
      transition: transform 0.12s var(--ease-standard, ease), border-color 0.12s var(--ease-standard, ease);
    }
    .v-desktop-shell .v-dtile:hover { transform: translateY(-3px); border-color: var(--border-strong); }
    .v-desktop-shell .v-dtile.on { border-color: var(--accent); color: var(--accent); }
    .v-desktop-shell .v-dtile.on::after {
      content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
      width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    }
  </style>
  <!-- Publishes the api origin + per-app session tokens the shell hands each app iframe. Served by the
       LOCAL face only (like /session.js). On the network face it 404s and the shell falls back to
       same-origin /api with no pre-minted tokens (apps then mint fresh in-process tokens). -->
  <script src="/shell-session.js"></script>
</head>
<body>
  <div class="v-desktop-shell v-screen theme-dark v-wall-dark" id="screen" data-vita-screen="desktop"></div>
  <!-- The offline shell bundle: real WM + web-app window host + ui broker + dock/launcher. -->
  <script type="module" src="/shell/shell.js"></script>
</body>
</html>
