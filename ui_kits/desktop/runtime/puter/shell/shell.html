<!doctype html>
<!--
  Vita multi-window SHELL — served at the kiosk URL (the on-device local face and the dev harness
  both serve this page). It hosts MULTIPLE app windows in one desktop: Vita's own apps (Vita Desk,
  the deploy console) AND real third-party Puter apps (serverless-todo, notepad), each in a managed,
  draggable/resizable/closable window, launched from the dock's app launcher.

  How it differs from kiosk-entry.html: that page WAS the single full-screen Vita Desk app. THIS page
  is the window manager + dock + launcher that hosts Vita Desk (and everything else) as a WINDOW.

  Licensing: only /_vendor/puter/v2.js (Apache-2.0 puter.js SDK) and the two third-party apps under
  /apps/* (each MIT, under their own LICENSE) are third-party. The shell itself (shell.js, this page,
  the window manager + broker + api_origin) is Vita's own code. No AGPL Puter desktop is shipped.

  The shell does NOT load puter.js itself — only the app IFRAMES do. The shell is the postMessage
  PARENT (the broker) those iframes talk to.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vita Desktop</title>
  <link rel="stylesheet" href="/ui_kits/styles.css" />
  <link rel="stylesheet" href="/ui_kits/desktop/kit.css" />
  <!-- Shared design-system bridge: maps canonical tokens onto the --vita-* namespace the apps read,
       plus the shared first-party component look. Linked LAST so it can resolve the tokens above. -->
  <link rel="stylesheet" href="/ui_kits/vita-app-theme.css" />
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;rect width='16' height='16' rx='4' fill='%235b8cff'/&gt;&lt;/svg&gt;" />
  <style>
    /* ---------------------------------------------------------------------------------------------
       Vita DESKTOP SHELL — the LIVE multi-window desktop frame (not a static design-canvas mockup).
       kit.css sizes `.v-screen` to a fixed 1280x800 canvas for the mockup screens; that is WRONG for
       the live shell, which must fill the real display (e.g. the on-device 1920x1440 CEF surface). We
       own the shell's chrome HERE, scoped to `.v-desktop-shell`, and force full-viewport so it can
       never collapse to the design canvas regardless of cascade/order on-device. `!important` on the
       layout root is deliberate: the on-device build must not be able to clip the desktop.

       This stylesheet is the PREMIUM FRAME: a tasteful wallpaper, a prominent system bar (brand +
       menu context left, live status + clock right), a macOS/Windows-quality dock with pinned apps,
       and polished window chrome. All of it is Vita's own code — no AGPL Puter desktop is shipped.
       --------------------------------------------------------------------------------------------- */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--surface-base, #06070a); }
    html, body { height: 100dvh; }
    .v-desktop-shell, .v-desktop-shell * { -webkit-font-smoothing: antialiased; }

    /* The shell root fills the viewport (overrides kit.css `.v-screen{width:1280px;height:800px}`). */
    .v-desktop-shell.v-screen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      overflow: hidden !important;
    }

    /* ----- WALLPAPER -----------------------------------------------------------------------------
       A deliberate, layered desktop background so the empty desktop reads as intentional (not flat
       black): a cool aurora glow top-right, a violet wash bottom-left, a deep vertical base gradient,
       and a faint dot grid for texture + a soft inner vignette to frame the windows. */
    .v-desktop-shell.v-wall-dark {
      background:
        radial-gradient(1300px 880px at 84% -16%, rgba(79, 157, 255, 0.20), transparent 58%),
        radial-gradient(1020px 760px at -10% 116%, rgba(124, 92, 246, 0.16), transparent 60%),
        radial-gradient(760px 520px at 50% 50%, rgba(40, 120, 200, 0.05), transparent 70%),
        linear-gradient(168deg, #10141b 0%, #0a0d13 52%, #07090d 100%) !important;
    }
    .v-desktop-shell .v-wallpaper-fx {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        radial-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 46px 46px, 46px 46px;
      background-position: 0 0, 23px 23px;
      box-shadow: inset 0 0 240px 40px rgba(0, 0, 0, 0.55);
    }

    /* The desktop area between the system bar (top) and the dock (bottom). App windows mount here. */
    .v-desktop-shell .v-desk-area { position: absolute; inset: 0; }

    /* ----- SYSTEM BAR (top) — handoff MenuBar ----------------------------------------------------
       Translucent + backdrop-blur over the wallpaper, hairline border, token-driven. brand + menus
       on the left; a live status cluster (Lucide wifi/battery + clock) on the right. All colors come
       from the design tokens so it stays correct in light + dark. */
    .v-desktop-shell .v-menubar {
      position: absolute; top: 0; left: 0; right: 0;
      height: 34px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      background: var(--surface-translucent);
      border-bottom: 1px solid var(--hairline);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      box-shadow: none;
      z-index: 60;
      font-family: var(--font-sans, system-ui);
    }
    .v-desktop-shell .v-bar-left { display: flex; align-items: center; gap: 18px; min-width: 0; }
    /* Brand: the clean Vita.ts wordmark — Geist + a monospace `.ts` in the accent. No logo square. */
    .v-desktop-shell .v-brand {
      display: inline-flex; align-items: baseline; gap: 1px;
      font-weight: 600; font-size: 13.5px; letter-spacing: 0; color: var(--text);
    }
    .v-desktop-shell .v-brand i {
      font-style: normal; font-family: var(--font-mono, ui-monospace, monospace);
      font-weight: 600; font-size: 10.5px; color: var(--accent);
    }
    /* The menu titles (File/Edit/View/Go/Window/Help) + active-window context. */
    .v-desktop-shell .v-menus { display: flex; align-items: center; gap: 15px; font-size: 12.5px; color: var(--text-secondary); font-weight: 500; }
    .v-desktop-shell .v-menus > span { cursor: default; user-select: none; }
    .v-desktop-shell .v-menus [data-shell-status] { color: var(--text-muted); }

    .v-desktop-shell .v-status { display: flex; align-items: center; gap: 11px; color: var(--text-secondary); }
    .v-desktop-shell .v-status .ico { display: inline-flex; align-items: center; justify-content: center; }
    .v-desktop-shell .v-status .ico svg { display: block; stroke-width: 2; }
    .v-desktop-shell .v-status .clk {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums;
    }
    .v-desktop-shell .v-status .clk .clk-date {
      font-size: 9px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--text-faint); font-family: var(--font-sans, system-ui); margin-left: 6px;
    }

    /* ----- DOCK (bottom) — handoff Dock ----------------------------------------------------------
       A translucent + backdrop-blur pill of SUBTLE NEUTRAL tiles (var(--surface)/var(--border)) with
       Lucide icons in currentColor — NOT colored tint chips. A launcher (all apps), PINNED apps always
       visible, and a section for extra running windows. Hover lift; accent ring + indicator when
       running/focused. Token-driven so it stays correct in light + dark. */
    .v-desktop-shell .v-dock {
      position: fixed;
      left: 50%;
      bottom: 14px;
      top: auto;
      transform: translateX(-50%);
      display: flex; align-items: flex-end; gap: 9px;
      padding: 8px 11px;
      background: var(--surface-translucent);
      border: 1px solid var(--border);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-3);
      backdrop-filter: var(--blur-thick); -webkit-backdrop-filter: var(--blur-thick);
      z-index: 55;
    }
    .v-desktop-shell .v-dsep {
      width: 1px; height: 36px; align-self: center; margin: 0 2px;
      background: var(--hairline);
    }
    .v-desktop-shell .v-dtile {
      width: 50px; height: 50px;
      border-radius: var(--radius-tile);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-1);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
      transition: transform 0.14s cubic-bezier(.2,.8,.3,1.2), border-color 0.14s ease, box-shadow 0.14s ease, color 0.14s ease;
    }
    .v-desktop-shell .v-dtile svg { width: 25px; height: 25px; display: block; stroke-width: 2; }
    .v-desktop-shell .v-dtile .v-demoji { font-size: 23px; line-height: 1; }
    .v-desktop-shell .v-dtile:hover {
      transform: translateY(-6px) scale(1.04);
      border-color: var(--border-strong);
      color: var(--text);
      box-shadow: var(--shadow-3);
    }
    .v-desktop-shell .v-dtile:active { transform: translateY(-3px) scale(0.99); }
    /* Token-driven active state from the design system. */
    .v-desktop-shell .v-dtile.on { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow-accent), var(--shadow-1); }
    /* Tooltip label that floats above a tile on hover. */
    .v-desktop-shell .v-dtile .v-dtip {
      position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%) translateY(4px);
      padding: 4px 9px; border-radius: var(--radius-sm); white-space: nowrap;
      font: 600 11.5px var(--font-sans, system-ui); color: var(--text);
      background: var(--surface-overlay); border: 1px solid var(--border);
      box-shadow: var(--shadow-3);
      opacity: 0; pointer-events: none; transition: opacity 0.12s ease, transform 0.12s ease;
    }
    .v-desktop-shell .v-dtile:hover .v-dtip { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* The launcher tile reads as the primary action — accent tile (white-on-accent). */
    .v-desktop-shell .v-dtile.v-launcher {
      background: var(--accent);
      border-color: transparent;
      color: var(--accent-fg);
      box-shadow: var(--glow-accent), var(--shadow-1);
    }
    .v-desktop-shell .v-dtile.v-launcher:hover { background: var(--accent-hover); color: var(--accent-fg); }
    /* Running-window indicator under a tile. */
    .v-desktop-shell .v-dtile .v-run-dot {
      content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: var(--text-faint);
      opacity: 0; transition: opacity 0.14s ease, background 0.14s ease, width 0.14s ease;
    }
    .v-desktop-shell .v-dtile.running .v-run-dot { opacity: 1; background: var(--accent); }
    .v-desktop-shell .v-dtile.focused .v-run-dot { width: 16px; border-radius: 2px; background: var(--accent); }
    .v-desktop-shell .v-dtile.running { border-color: var(--accent); color: var(--accent); }
    .v-desktop-shell .v-dtile.focused { border-color: var(--accent); box-shadow: var(--glow-accent), var(--shadow-1); }
  </style>
  <!-- Publishes the api origin + per-app session tokens the shell hands each app iframe. Served by the
       LOCAL face only (like /session.js). On the network face it 404s and the shell falls back to
       same-origin /api with no pre-minted tokens (apps then mint fresh in-process tokens). -->
  <script src="/shell-session.js"></script>
</head>
<body>
  <div class="v-desktop-shell v-screen theme-dark v-wall-dark" id="screen" data-vita-screen="desktop">
    <!-- Wallpaper texture/vignette layer (sits behind all chrome + windows; z-index:0). -->
    <div class="v-wallpaper-fx" aria-hidden="true"></div>
  </div>
  <!-- Vendored Lucide (offline, no CDN) — exposes window.lucide so the window manager can render
       Lucide title-bar icons (the dock/menu-bar SVGs are inline and need no runtime). -->
  <script src="/ui_kits/_vendor/lucide.min.js"></script>
  <!-- The offline shell bundle: real WM + web-app window host + ui broker + dock/launcher. -->
  <script type="module" src="/shell/shell.js"></script>
</body>
</html>
