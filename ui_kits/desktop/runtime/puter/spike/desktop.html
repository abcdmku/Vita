<!doctype html>
<!--
  Vita ⇄ Puter spike — DESKTOP preview.

  This is the owner-facing live preview: the REAL Vita window manager hosting a REAL Puter app in a
  managed dark window. The Puter app (an iframe loading the vendored puter.js) round-trips fs/kv/auth
  against Vita's LOCAL api_origin (served at /api by serve-spike.ts) and posts ui.* messages to this
  page's broker (see the "broker log" panel — alert / setWindowTitle land there live).

  Serve it with:  node --experimental-strip-types ui_kits/desktop/runtime/puter/spike/serve-spike.ts
  Then open:       http://127.0.0.1:8188/spike/desktop.html
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>Vita ⇄ Puter — Desktop Spike</title>
  <link rel="stylesheet" href="/ui_kits/styles.css" />
  <link rel="stylesheet" href="/ui_kits/desktop/kit.css" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #08090c; overflow: hidden; }
    .v-screen { width: 100vw; height: 100vh; }
    .spike-panel {
      position: absolute; top: 44px; right: 16px; z-index: 60; width: 320px;
      background: var(--surface-raised, #15171d); border: 1px solid var(--border, #262a33);
      border-radius: 10px; padding: 12px 14px; font: 12px system-ui, sans-serif; color: var(--text, #e6e8ee);
    }
    .spike-panel h2 { font-size: 13px; margin: 0 0 6px; }
    .spike-panel .hint { color: #8b8f9c; line-height: 1.5; margin-bottom: 8px; }
    .spike-panel button {
      font: 12px system-ui; color: var(--text, #e6e8ee); background: var(--surface, #0e0f13);
      border: 1px solid var(--border, #262a33); border-radius: 7px; padding: 7px 11px; cursor: pointer;
    }
    .spike-panel button:hover { border-color: var(--accent, #5b9dff); }
    #broker-log { margin-top: 10px; max-height: 220px; overflow: auto; border-top: 1px solid var(--border, #262a33); padding-top: 8px; }
  </style>
</head>
<body>
  <div class="v-screen theme-dark v-wall-dark" id="screen">
    <div class="v-menubar">
      <div style="display:flex;align-items:center;gap:18px">
        <span class="v-brand">Vita<i>.ts</i></span>
        <div class="v-menus"><span>Puter App Platform Spike</span></div>
      </div>
    </div>

    <div class="spike-panel">
      <h2>🧪 Puter spike</h2>
      <div class="hint">
        A real Puter app runs in the managed window. It calls <code>puter.fs.*</code> /
        <code>puter.kv.*</code> against Vita's local api_origin, and <code>puter.ui.*</code> posts here.
      </div>
      <button id="launch-spike">Relaunch spike app</button>
      <div id="broker-log"></div>
    </div>
  </div>

  <!--
    The api_origin runs in serve-spike.ts (a separate process) with its own capability registry, so
    the iframe must present the token THAT server pre-minted. These constants mirror serve-spike.ts's
    PREVIEW_TOKEN / PREVIEW_INSTANCE. (On-device the host + api_origin share one registry and no token
    needs injecting.)
  -->
  <script>
    window.__VITA_SPIKE_SESSION__ = {
      token: "preview-owner-token-0001",
      appInstanceId: "preview-instance-0001",
    };
  </script>
  <!-- The offline preview bundle (real WM + web-app window host + ui broker). -->
  <script type="module" src="/spike/spike-preview.js"></script>
</body>
</html>
